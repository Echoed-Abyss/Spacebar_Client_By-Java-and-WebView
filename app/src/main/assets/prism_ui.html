<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prism · 液态玻璃服务器社交</title>
    <style>
        /* ===== CSS Reset & 全局变量 ===== */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        :root {
          --bg-deep: #0a0a0f;
          --glass-bg: rgba(255, 255, 255, 0.06);
          --glass-border: rgba(255, 255, 255, 0.08);
          --glass-highlight: rgba(255, 255, 255, 0.15);
          --text-primary: rgba(255, 255, 255, 0.92);
          --text-secondary: rgba(255, 255, 255, 0.55);
          --accent-aurora: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          --accent-glow: rgba(107, 140, 255, 0.5);
          --server-active: rgba(255, 255, 255, 0.2);
          --bubble-other: rgba(255, 255, 255, 0.08);
          --bubble-self: rgba(107, 140, 255, 0.4);
          --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4);
          --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: var(--text-primary);
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
          -webkit-tap-highlight-color: transparent;
          user-select: none;
          -webkit-user-select: none;
        }

        /* 手机模拟框 */
        .phone-frame {
          width: 100%;
          max-width: 420px;
          height: 100vh;
          height: 100dvh;
          background: rgba(10, 10, 20, 0.7);
          backdrop-filter: blur(60px);
          -webkit-backdrop-filter: blur(60px);
          border-radius: 0;
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 30px 80px rgba(0, 0, 0, 0.6);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
        }

        @media (min-width: 420px) {
          .phone-frame {
            border-radius: 40px;
            height: 90vh;
            height: 90dvh;
          }
        }

        /* ===== 主布局：服务器列表 + 频道面板 ===== */
        .app-container {
          display: flex;
          flex: 1;
          height: 100%;
          overflow: hidden;
        }

        /* ---------- 左侧服务器坞 ---------- */
        .server-dock {
          width: 72px;
          min-width: 72px;
          background: rgba(10, 10, 25, 0.5);
          backdrop-filter: blur(40px);
          -webkit-backdrop-filter: blur(40px);
          border-right: 1px solid rgba(255, 255, 255, 0.06);
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 24px 12px;
          gap: 10px;
          overflow-y: auto;
          z-index: 10;
        }

        .server-icon {
          width: 48px;
          height: 48px;
          border-radius: 24px;
          background: var(--glass-bg);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.4s var(--transition-smooth);
          position: relative;
          cursor: pointer;
          flex-shrink: 0;
        }

        .server-icon:hover {
          background: rgba(255, 255, 255, 0.12);
          border-color: rgba(255, 255, 255, 0.25);
          transform: translateY(-1px);
        }

        .server-icon.active {
          border-radius: 16px;
          background: var(--server-active);
          border-color: rgba(255, 255, 255, 0.4);
          box-shadow: 0 0 30px rgba(107, 140, 255, 0.4);
        }

        .server-icon.active::before {
          content: '';
          position: absolute;
          left: -16px;
          top: 50%;
          transform: translateY(-50%);
          width: 4px;
          height: 32px;
          border-radius: 0 4px 4px 0;
          background: white;
          box-shadow: 0 0 20px rgba(107, 140, 255, 0.8);
          transition: height 0.3s ease;
        }

        .server-icon .unread-badge {
          position: absolute;
          top: -6px;
          right: -6px;
          background: var(--accent-aurora);
          color: white;
          font-size: 11px;
          font-weight: 700;
          min-width: 20px;
          height: 20px;
          line-height: 20px;
          text-align: center;
          border-radius: 10px;
          padding: 0 6px;
          box-shadow: 0 4px 12px rgba(255, 107, 157, 0.5);
          animation: badgePulse 2s infinite;
          z-index: 2;
        }

        @keyframes badgePulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.1); }
        }

        .server-icon svg {
          width: 28px;
          height: 28px;
          fill: rgba(255, 255, 255, 0.8);
          filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .server-icon.active svg {
          fill: white;
        }

        /* 分隔线 */
        .dock-separator {
          width: 32px;
          height: 2px;
          border-radius: 1px;
          background: rgba(255, 255, 255, 0.1);
          margin: 4px 0;
        }


        /* ---------- 右侧频道面板 ---------- */
        .channel-panel {
          flex: 1;
          display: flex;
          flex-direction: column;
          background: rgba(15, 15, 30, 0.4);
          backdrop-filter: blur(50px);
          -webkit-backdrop-filter: blur(50px);
          position: relative;
        }

        /* 服务器头部 */
        .server-header {
          padding: 20px 20px 16px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          position: relative;
          z-index: 2;
        }

        .server-name {
          font-size: 22px;
          font-weight: 700;
          background: var(--accent-aurora);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          letter-spacing: -0.3px;
          transition: transform 0.3s ease;
        }

        .server-header:active .server-name {
          transform: scale(0.97);
        }

        /* 频道列表 */
        .channel-list {
          flex: 1;
          overflow-y: auto;
          padding: 12px 0;
          scroll-behavior: smooth;
        }

        .channel-category {
          padding: 8px 20px 4px;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.8px;
          color: rgba(255, 255, 255, 0.35);
        }

        .channel-item {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 20px;
          margin: 2px 8px;
          border-radius: 12px;
          cursor: pointer;
          transition: all 0.3s var(--transition-smooth);
          color: var(--text-secondary);
          font-size: 15px;
          position: relative;
          overflow: hidden;
        }

        .channel-item::after {
          content: '';
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.15) 0%, transparent 70%);
          opacity: 0;
          transition: opacity 0.3s;
          pointer-events: none;
        }

        .channel-item:hover::after,
        .channel-item:active::after {
          opacity: 1;
        }

        .channel-item.active {
          background: rgba(255, 255, 255, 0.1);
          color: white;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .channel-hash {
          font-weight: 700;
          opacity: 0.6;
        }

        .channel-item.active .channel-hash {
          opacity: 1;
        }

        /* 语音频道特殊样式 */
        .voice-channel .voice-indicator {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-left: auto;
        }

        .voice-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #4ade80;
          box-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
          animation: voiceGlow 1.5s infinite alternate;
        }

        @keyframes voiceGlow {
          from { box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
          to { box-shadow: 0 0 20px rgba(74, 222, 128, 0.8); }
        }

        .voice-avatars {
          display: flex;
          margin-right: 4px;
        }

        .voice-avatar {
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: rgba(255,255,255,0.3);
          border: 2px solid rgba(0,0,0,0.3);
          margin-left: -6px;
          backdrop-filter: blur(4px);
          -webkit-backdrop-filter: blur(4px);
        }

        .voice-avatar:first-child {
          margin-left: 0;
        }

        /* 用户在线列表 */
        .online-users {
          padding: 0 12px 12px;
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          border-top: 1px solid rgba(255,255,255,0.04);
          margin-top: 8px;
          padding-top: 12px;
        }

        .online-user {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: rgba(255,255,255,0.1);
          border: 2px solid transparent;
          position: relative;
          cursor: pointer;
          transition: all 0.3s;
        }

        .online-user:hover {
          border-color: rgba(255,255,255,0.5);
          transform: scale(1.1);
        }

        .online-user::after {
          content: '';
          position: absolute;
          bottom: 0;
          right: 0;
          width: 10px;
          height: 10px;
          background: #4ade80;
          border-radius: 50%;
          border: 2px solid rgba(0,0,0,0.6);
        }


        /* ===== 聊天界面（初始隐藏） ===== */
        .chat-view {
          flex: 1;
          display: none;
          flex-direction: column;
          background: rgba(15, 15, 30, 0.4);
          backdrop-filter: blur(50px);
          -webkit-backdrop-filter: blur(50px);
          position: absolute;
          inset: 0;
          z-index: 20;
          transform: translateX(100%);
          transition: transform 0.45s var(--transition-smooth);
        }

        .chat-view.open {
          display: flex;
          transform: translateX(0);
        }

        .chat-header {
          padding: 16px 20px;
          display: flex;
          align-items: center;
          gap: 14px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
          backdrop-filter: blur(30px);
          -webkit-backdrop-filter: blur(30px);
        }

        .back-btn {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: rgba(255,255,255,0.08);
          border: none;
          color: white;
          font-size: 18px;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.3s;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
        }

        .back-btn:active {
          background: rgba(255,255,255,0.2);
          transform: scale(0.9);
        }

        .chat-title {
          font-weight: 600;
          font-size: 17px;
          color: var(--text-primary);
        }

        /* 消息区域 */
        .messages-area {
          flex: 1;
          overflow-y: auto;
          padding: 20px 16px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .message {
          display: flex;
          gap: 10px;
          max-width: 85%;
          animation: messageIn 0.4s ease-out;
        }

        @keyframes messageIn {
          from {
            opacity: 0;
            transform: translateY(16px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        .message.self {
          align-self: flex-end;
          flex-direction: row-reverse;
        }

        .msg-avatar {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background: rgba(255,255,255,0.2);
          flex-shrink: 0;
        }

        .msg-bubble {
          padding: 10px 16px;
          border-radius: 18px;
          font-size: 14px;
          line-height: 1.5;
          position: relative;
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.08);
        }

        .message:not(.self) .msg-bubble {
          background: var(--bubble-other);
          border-bottom-left-radius: 6px;
        }

        .message.self .msg-bubble {
          background: var(--bubble-self);
          border-bottom-right-radius: 6px;
          background: linear-gradient(135deg, rgba(107, 140, 255, 0.5), rgba(182, 102, 255, 0.5));
          border: 1px solid rgba(255,255,255,0.2);
        }

        /* 输入框 */
        .chat-input-area {
          padding: 12px 16px;
          padding-bottom: max(12px, env(safe-area-inset-bottom));
          display: flex;
          gap: 10px;
          align-items: center;
          background: rgba(0,0,0,0.3);
          backdrop-filter: blur(40px);
          -webkit-backdrop-filter: blur(40px);
          border-top: 1px solid rgba(255,255,255,0.06);
        }

        .input-glass {
          flex: 1;
          background: rgba(255, 255, 255, 0.06);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 24px;
          padding: 12px 18px;
          color: white;
          font-size: 15px;
          outline: none;
          transition: all 0.35s ease;
        }

        .input-glass:focus {
          background: rgba(255, 255, 255, 0.14);
          border-color: rgba(255, 255, 255, 0.35);
          box-shadow: 0 0 30px rgba(107, 140, 255, 0.25);
        }

        .input-glass::placeholder {
          color: rgba(255, 255, 255, 0.35);
        }

        .send-btn {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: none;
          background: var(--accent-aurora);
          color: white;
          font-size: 18px;
          cursor: pointer;
          transition: all 0.35s ease;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 20px rgba(107, 140, 255, 0.5);
          opacity: 0.5;
          pointer-events: none;
          transform: scale(0.9);
        }

        .send-btn.active {
          opacity: 1;
          pointer-events: auto;
          transform: scale(1);
          animation: sendGlow 2s infinite;
        }

        @keyframes sendGlow {
          0%, 100% { box-shadow: 0 4px 20px rgba(107, 140, 255, 0.5); }
          50% { box-shadow: 0 4px 35px rgba(182, 102, 255, 0.8); }
        }

        .send-btn:active {
          transform: scale(0.85);
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
          width: 3px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.1);
          border-radius: 10px;
        }

        /* 液态波纹效果（用于点击反馈） */
        .ripple {
          position: absolute;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.4);
          transform: scale(0);
          animation: rippleEffect 0.7s ease-out forwards;
          pointer-events: none;
        }

        @keyframes rippleEffect {
          to {
            transform: scale(4);
            opacity: 0;
          }
        }
    </style>
</head>
<body>
<div class="phone-frame">
    <!-- 主容器：服务器列表 + 频道面板 -->
    <div class="app-container" id="appContainer">
        <!-- 左侧服务器坞 -->
        <nav class="server-dock" id="serverDock">
            <!-- JS动态生成服务器图标 -->
        </nav>

        <!-- 右侧频道面板 -->
        <div class="channel-panel" id="channelPanel">
            <div class="server-header">
                <div class="server-name" id="serverNameDisplay">棱镜小镇</div>
            </div>
            <div class="channel-list" id="channelList">
                <!-- JS动态生成频道列表 -->
            </div>
            <div class="online-users" id="onlineUsers">
                <!-- JS动态生成在线用户头像 -->
            </div>
        </div>

        <!-- 聊天视图（覆盖层） -->
        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back-btn" id="backBtn" aria-label="返回">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <span class="chat-title" id="chatTitle"># 综合大厅</span>
            </div>
            <div class="messages-area" id="messagesArea">
                <!-- JS动态生成消息 -->
            </div>
            <div class="chat-input-area">
                <input type="text" class="input-glass" id="messageInput" placeholder="发送消息..." autocomplete="off">
                <button class="send-btn" id="sendBtn" aria-label="发送">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
      // ===== 数据模型 =====
      const servers = [
        {
          id: 's1',
          name: '棱镜小镇',
          icon: '🏠',
          channels: [
            { id: 'c1', type: 'text', name: '综合大厅', category: '文字频道' },
            { id: 'c2', type: 'text', name: '技术闲聊', category: '文字频道' },
            { id: 'c3', type: 'text', name: '设计灵感', category: '文字频道' },
            { id: 'c4', type: 'voice', name: '语音畅聊', category: '语音频道', activeUsers: 3 },
            { id: 'c5', type: 'voice', name: '游戏开黑', category: '语音频道', activeUsers: 2 },
          ],
          onlineUsers: 12,
        },
        {
          id: 's2',
          name: '星云探索',
          icon: '🌌',
          channels: [
            { id: 'c6', type: 'text', name: '深空电波', category: '文字频道' },
            { id: 'c7', type: 'text', name: '天文摄影', category: '文字频道' },
            { id: 'c8', type: 'voice', name: '观测站', category: '语音频道', activeUsers: 5 },
          ],
          onlineUsers: 8,
        },
        {
          id: 's3',
          name: '像素工坊',
          icon: '🎮',
          channels: [
            { id: 'c9', type: 'text', name: '新游速递', category: '文字频道' },
            { id: 'c10', type: 'text', name: '独立游戏', category: '文字频道' },
          ],
          onlineUsers: 21,
        },
      ];

      // 模拟聊天消息（频道ID -> 消息数组）
      const channelMessages = {
        c1: [
          { id: 'm1', userId: 'u1', userName: '星辰', text: '欢迎来到棱镜小镇的综合大厅！✨', self: false },
          { id: 'm2', userId: 'u2', userName: '极光', text: '大家好啊，今天天气真好', self: false },
          { id: 'm3', userId: 'me', userName: '我', text: '哈哈，是啊！这个新APP的UI太好看了', self: true },
          { id: 'm4', userId: 'u3', userName: '像素猫', text: '液态玻璃效果真不错，感觉很通透', self: false },
          { id: 'm5', userId: 'u1', userName: '星辰', text: '有人一起打游戏吗？', self: false },
        ],
        c2: [
          { id: 'm1', userId: 'u4', userName: 'DevGuy', text: 'Rust还是Go？好纠结', self: false },
        ],
        c3: [
          { id: 'm1', userId: 'u5', userName: 'DesignerX', text: '分享一张最近做的UI稿', self: false },
        ],
      };

      // ===== 状态管理 =====
      let currentServerId = 's1';
      let currentChannelId = 'c1';
      let chatOpen = false;

      // ===== DOM引用 =====
      const serverDock = document.getElementById('serverDock');
      const channelList = document.getElementById('channelList');
      const serverNameDisplay = document.getElementById('serverNameDisplay');
      const onlineUsersContainer = document.getElementById('onlineUsers');
      const chatView = document.getElementById('chatView');
      const chatTitle = document.getElementById('chatTitle');
      const messagesArea = document.getElementById('messagesArea');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const backBtn = document.getElementById('backBtn');

      // ===== 工具函数 =====
      function getServer(id) {
        return servers.find(s => s.id === id);
      }

      function getChannel(serverId, channelId) {
        const server = getServer(serverId);
        return server ? server.channels.find(c => c.id === channelId) : null;
      }

      // 生成随机颜色头像背景
      function avatarColor(seed) {
        const colors = ['#6b8cff', '#b666ff', '#ff6b9d', '#4ade80', '#f59e0b', '#ef4444', '#06b6d4'];
        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
          hash = seed.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
      }

      // ===== 渲染函数 =====
      function renderServerDock() {
        serverDock.innerHTML = '';
        servers.forEach((server, index) => {
          const iconEl = document.createElement('div');
          iconEl.className = `server-icon${server.id === currentServerId ? ' active' : ''}`;
          iconEl.setAttribute('data-server-id', server.id);
          iconEl.innerHTML = `<span style="font-size:22px;">${server.icon}</span>`;

          // 添加点击事件
          iconEl.addEventListener('click', (e) => {
            addRipple(e);
            switchServer(server.id);
          });

          serverDock.appendChild(iconEl);

          // 在第一个服务器后添加分隔线
          if (index === 0) {
            const sep = document.createElement('div');
            sep.className = 'dock-separator';
            serverDock.appendChild(sep);
          }
        });

        // 添加"+"按钮
        const addBtn = document.createElement('div');
        addBtn.className = 'server-icon';
        addBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>`;
        addBtn.style.opacity = '0.5';
        addBtn.addEventListener('click', (e) => {
          addRipple(e);
          // 模拟添加服务器（不实现完整逻辑）
          alert('添加新服务器（演示模式）');
        });
        serverDock.appendChild(addBtn);
      }

      function renderChannelList() {
        const server = getServer(currentServerId);
        if (!server) return;

        serverNameDisplay.textContent = server.name;
        channelList.innerHTML = '';

        // 按类别分组频道
        const categories = {};
        server.channels.forEach(ch => {
          if (!categories[ch.category]) categories[ch.category] = [];
          categories[ch.category].push(ch);
        });

        Object.entries(categories).forEach(([category, channels]) => {
          // 类别标题
          const catHeader = document.createElement('div');
          catHeader.className = 'channel-category';
          catHeader.textContent = category;
          channelList.appendChild(catHeader);

          // 频道项目
          channels.forEach(ch => {
            const item = document.createElement('div');
            item.className = `channel-item${ch.id === currentChannelId ? ' active' : ''}${ch.type === 'voice' ? ' voice-channel' : ''}`;
            item.setAttribute('data-channel-id', ch.id);

            const prefix = ch.type === 'voice' ? '🔊 ' : '<span class="channel-hash">#</span> ';
            let extraHTML = '';

            if (ch.type === 'voice' && ch.activeUsers) {
              extraHTML = `
                <div class="voice-indicator">
                  <div class="voice-avatars">
                    ${Array(Math.min(ch.activeUsers, 3)).fill('').map(() => '<div class="voice-avatar"></div>').join('')}
                  </div>
                  <div class="voice-dot"></div>
                </div>
              `;
            }

            item.innerHTML = `${prefix}${ch.name}${extraHTML}`;

            item.addEventListener('click', (e) => {
              addRipple(e);
              openChannel(ch.id);
            });

            // 鼠标位置追踪用于光影效果
            item.addEventListener('mousemove', (e) => {
              const rect = item.getBoundingClientRect();
              const x = ((e.clientX - rect.left) / rect.width) * 100;
              const y = ((e.clientY - rect.top) / rect.height) * 100;
              item.style.setProperty('--mouse-x', `${x}%`);
              item.style.setProperty('--mouse-y', `${y}%`);
            });

            channelList.appendChild(item);
          });
        });

        // 渲染在线用户
        renderOnlineUsers(server.onlineUsers || 0);
      }

      function renderOnlineUsers(count) {
        onlineUsersContainer.innerHTML = '';
        for (let i = 0; i < Math.min(count, 10); i++) {
          const userEl = document.createElement('div');
          userEl.className = 'online-user';
          userEl.style.backgroundColor = avatarColor(`user${i}`);
          onlineUsersContainer.appendChild(userEl);
        }
      }

      function renderMessages() {
        const messages = channelMessages[currentChannelId] || [];
        messagesArea.innerHTML = '';

        messages.forEach(msg => {
          const msgEl = document.createElement('div');
          msgEl.className = `message${msg.self ? ' self' : ''}`;
          msgEl.innerHTML = `
            <div class="msg-avatar" style="background-color:${avatarColor(msg.userId)};"></div>
            <div class="msg-bubble">
              <div style="font-size:11px;opacity:0.6;margin-bottom:2px;">${msg.userName}</div>
              ${msg.text}
            </div>
          `;
          messagesArea.appendChild(msgEl);
        });

        // 滚动到底部
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }

      // ===== 交互逻辑 =====
      function switchServer(serverId) {
        if (currentServerId === serverId && !chatOpen) return;
        currentServerId = serverId;
        const server = getServer(serverId);
        // 默认选择第一个文字频道
        const firstTextChannel = server.channels.find(c => c.type === 'text');
        if (firstTextChannel) {
          currentChannelId = firstTextChannel.id;
        }
        closeChat();
        renderServerDock();
        renderChannelList();
      }

      function openChannel(channelId) {
        const channel = getChannel(currentServerId, channelId);
        if (!channel) return;

        currentChannelId = channelId;

        if (channel.type === 'text') {
          // 打开聊天视图
          chatView.classList.add('open');
          chatOpen = true;
          chatTitle.textContent = `# ${channel.name}`;
          renderMessages();
          // 更新频道列表高亮
          updateChannelActive();
        } else {
          // 语音频道提示
          alert(`进入语音频道：${channel.name}（演示模式）`);
          updateChannelActive();
        }
      }

      function closeChat() {
        chatView.classList.remove('open');
        chatOpen = false;
        messageInput.value = '';
        updateSendButton();
        updateChannelActive();
      }

      function updateChannelActive() {
        // 更新所有频道项的active状态
        document.querySelectorAll('.channel-item').forEach(item => {
          const chId = item.getAttribute('data-channel-id');
          if (chId === currentChannelId && chatOpen) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }

      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        // 添加消息到本地数据
        if (!channelMessages[currentChannelId]) {
          channelMessages[currentChannelId] = [];
        }
        channelMessages[currentChannelId].push({
          id: 'm' + Date.now(),
          userId: 'me',
          userName: '我',
          text: text,
          self: true,
        });

        messageInput.value = '';
        updateSendButton();
        renderMessages();

        // 模拟对方回复
        setTimeout(() => {
          channelMessages[currentChannelId].push({
            id: 'm' + Date.now(),
            userId: 'u' + Math.floor(Math.random() * 5 + 1),
            userName: ['星辰', '极光', '像素猫', 'DevGuy', 'DesignerX'][Math.floor(Math.random() * 5)],
            text: getRandomReply(),
            self: false,
          });
          renderMessages();
        }, 1200 + Math.random() * 2000);
      }

      function getRandomReply() {
        const replies = [
          '赞同！',
          '哈哈没错',
          '这个想法不错',
          '稍等，我查一下',
          '有人要一起吗？',
          '👍',
          '厉害！',
        ];
        return replies[Math.floor(Math.random() * replies.length)];
      }

      function updateSendButton() {
        const hasText = messageInput.value.trim().length > 0;
        if (hasText) {
          sendBtn.classList.add('active');
        } else {
          sendBtn.classList.remove('active');
        }
      }

      // 液态波纹效果
      function addRipple(e) {
        const target = e.currentTarget;
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        const rect = target.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
        ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
        target.style.position = target.style.position || 'relative';
        target.style.overflow = target.style.overflow || 'hidden';
        target.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      }

      // ===== 事件监听 =====
      backBtn.addEventListener('click', () => {
        closeChat();
      });

      messageInput.addEventListener('input', updateSendButton);

      messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });

      sendBtn.addEventListener('click', sendMessage);

      // ===== 初始化 =====
      function init() {
        renderServerDock();
        renderChannelList();
        // 默认不打开聊天
        closeChat();
      }

      init();
    })();
</script>
</body>
</html>
