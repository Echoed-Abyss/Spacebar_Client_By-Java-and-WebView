<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 发现服务器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: rgba(255,255,255,0.9); min-height: 100vh; padding: 20px;
        }
        .header { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
        .back-btn {
          width:36px; height:36px; border-radius:50%;
          background:rgba(255,255,255,0.08); border:none; color:white; cursor:pointer;
          display:flex; align-items:center; justify-content:center;
        }
        .title { font-size:20px; font-weight:700; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px; padding-bottom:40px; }
        .card {
          background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
          border:1px solid rgba(255,255,255,0.1); border-radius:16px; overflow:hidden;
          cursor:pointer; transition:border-color 0.2s;
        }
        .card:hover { border-color:rgba(107,140,255,0.4); }
        .card-banner { width:100%; height:100px; object-fit:cover; background:linear-gradient(135deg,#6b8cff,#b666ff); }
        .card-body { padding:12px; }
        .card-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-desc { font-size:11px; color:rgba(255,255,255,0.5); margin:4px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .card-stats { font-size:10px; color:rgba(255,255,255,0.35); }
        .spinner { text-align:center; padding:40px; color:rgba(255,255,255,0.4); }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span class="title">发现服务器</span>
</div>
<div class="grid" id="serverGrid"><div class="spinner">加载中...</div></div>

<script>
    // TODO: 替换为你的API地址
    var DISCOVER_API = 'http://110.42.50.148:1155/api/image/discover.json';
    var API_BASE = '';
    var AUTH_TOKEN = '';

    window.addEventListener('DOMContentLoaded', function() {
      AUTH_TOKEN = RechNative.getToken();
      var creds = JSON.parse(RechNative.getSavedCredentials() || '{}');
      API_BASE = creds.apiUrl || '';
      loadDiscover();
    });

    function loadDiscover() {
      fetch(DISCOVER_API).then(function(r) { return r.json(); }).then(function(data) {
        var grid = document.getElementById('serverGrid');
        grid.innerHTML = '';
        if (data.servers && data.servers.length) {
          data.servers.forEach(function(s) {
            var c = document.createElement('div'); c.className = 'card';
            c.innerHTML = (s.banner ? '<img src="' + s.banner + '" class="card-banner">' : '<div class="card-banner"></div>') +
              '<div class="card-body"><div class="card-name">' + (s.icon ? s.icon + ' ' : '') + s.name + '</div>' +
              '<div class="card-desc">' + (s.description || '') + '</div>' +
              '<div class="card-stats">👥 ' + (s.total_members || 0) + ' | 🟢 ' + (s.online_members || 0) + '</div></div>';
            c.addEventListener('click', function() {
              if (s.invite_code) {
                joinServer(s.invite_code);
              }
            });
            grid.appendChild(c);
          });
        } else {
          grid.innerHTML = '<div class="spinner">暂无推荐服务器</div>';
        }
      }).catch(function() {
        document.getElementById('serverGrid').innerHTML = '<div class="spinner">加载失败</div>';
      });
    }

    function joinServer(code) {
      fetch(API_BASE + 'invites/' + code, {
        headers: { 'Authorization': AUTH_TOKEN }
      }).then(function(r) { return r.json(); }).then(function(inv) {
        if (inv.code) {
          fetch(API_BASE + 'invites/' + code, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN }
          }).then(function(r2) { return r2.json(); }).then(function(res) {
            if (res.code || res.id) {
              alert('成功加入服务器！');
              RechNative.navigate('rech_ui.html');
            } else {
              alert('加入失败');
            }
          });
        } else {
          alert('邀请码无效');
        }
      });
    }
</script>
</body>
</html>
