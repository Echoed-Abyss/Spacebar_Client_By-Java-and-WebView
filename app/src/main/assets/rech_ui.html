<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 液态玻璃服务器社交</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
          --bg-deep: #0a0a0f;
          --glass-bg: rgba(255,255,255,0.06);
          --glass-border: rgba(255,255,255,0.08);
          --text-primary: rgba(255,255,255,0.92);
          --text-secondary: rgba(255,255,255,0.55);
          --accent-aurora: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          --server-active: rgba(255,255,255,0.2);
          --bubble-other: rgba(255,255,255,0.08);
          --bubble-self: rgba(107,140,255,0.4);
          --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: var(--text-primary);
          height: 100vh; height: 100dvh;
          overflow: hidden;
          display: flex; justify-content: center; align-items: center;
          -webkit-tap-highlight-color: transparent;
          user-select: none; -webkit-user-select: none;
        }
        .phone-frame {
          width: 100%; max-width: 420px;
          height: 100vh; height: 100dvh;
          background: rgba(10,10,20,0.7);
          backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.6);
          display: flex; flex-direction: column; overflow: hidden;
        }
        .app-container { display:flex; flex:1; height:100%; overflow:hidden; }
        /* 服务器坞 */
        .server-dock {
          width: 72px; min-width: 72px;
          background: rgba(10,10,25,0.5);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border-right: 1px solid rgba(255,255,255,0.06);
          display: flex; flex-direction: column; align-items: center;
          padding: 24px 12px; gap: 10px; overflow-y: auto; z-index: 10;
        }
        .server-icon {
          width: 48px; height: 48px; border-radius: 24px;
          background: var(--glass-bg);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          display: flex; align-items: center; justify-content: center;
          transition: all 0.3s var(--transition-smooth);
          cursor: pointer; flex-shrink: 0; position: relative;
          font-size: 20px; color: rgba(255,255,255,0.8);
          overflow: hidden;
        }
        .server-icon.active {
          border-radius: 16px;
          background: var(--server-active);
          border-color: rgba(255,255,255,0.4);
          box-shadow: 0 0 30px rgba(107,140,255,0.4);
        }
        .server-icon.home-icon {
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          border: none;
        }
        .server-icon img {
          width: 100%; height: 100%; object-fit: cover;
        }
        .dock-separator {
          width: 32px; height: 2px; border-radius: 1px;
          background: rgba(255,255,255,0.1); margin: 4px 0;
        }
        /* 频道面板 */
        .channel-panel {
          flex: 1; display: flex; flex-direction: column;
          background: rgba(15,15,30,0.4);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .server-header {
          padding: 20px 20px 16px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
          z-index: 2;
        }
        .server-name {
          font-size: 22px; font-weight: 700;
          background: var(--accent-aurora);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .channel-list { flex:1; overflow-y:auto; padding:12px 0; }
        .channel-category {
          padding: 8px 20px 4px; font-size: 11px; font-weight: 600;
          text-transform: uppercase; letter-spacing: 0.8px;
          color: rgba(255,255,255,0.35);
        }
        .channel-item {
          display: flex; align-items: center; gap: 10px;
          padding: 10px 20px; margin: 2px 8px; border-radius: 12px;
          cursor: pointer; transition: background 0.2s;
          color: var(--text-secondary); font-size: 15px;
        }
        .channel-item:active { background: rgba(255,255,255,0.08); }
        .channel-item.active { background: rgba(255,255,255,0.1); color: white; }
        .channel-hash { font-weight:700; opacity:0.6; }
        .channel-item.active .channel-hash { opacity:1; }
        /* 用户底部栏 */
        .user-strip {
          padding: 12px 16px;
          background: rgba(0,0,0,0.3);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border-top: 1px solid rgba(255,255,255,0.06);
          display: flex; align-items: center; gap: 10px;
        }
        .user-strip-avatar {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.2);
          cursor: pointer; position: relative; overflow: hidden;
        }
        .user-strip-avatar img {
          width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
        }
        .online-dot {
          position: absolute; bottom: 0; right: 0;
          width: 10px; height: 10px;
          background: #4ade80; border-radius: 50%;
          border: 2px solid rgba(0,0,0,0.6);
        }
        .user-strip-info { flex:1; }
        .user-strip-name { font-size:14px; font-weight:600; }
        .user-strip-status { font-size:11px; color:rgba(255,255,255,0.4); }
        .settings-btn {
          width: 32px; height: 32px; border-radius: 50%;
          background: rgba(255,255,255,0.08); border: none; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          color: rgba(255,255,255,0.6);
        }
        /* 聊天视图 */
        .chat-view {
          flex: 1; display: none; flex-direction: column;
          background: rgba(15,15,30,0.6);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          position: absolute; inset: 0; z-index: 20;
          transform: translateX(100%);
          transition: transform 0.3s var(--transition-smooth);
        }
        .chat-view.open { display: flex; transform: translateX(0); }
        .chat-header {
          padding: 16px 20px; display: flex; align-items: center; gap: 14px;
          border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .back-btn {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.08); border: none;
          color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }
        .chat-title { font-weight:600; font-size:17px; }
        .messages-area {
          flex: 1; overflow-y: auto; padding: 20px 16px;
          display: flex; flex-direction: column; gap: 10px;
        }
        .message { display: flex; gap: 10px; max-width: 85%; animation: msgIn 0.3s ease-out; }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar {
          width: 32px; height: 32px; border-radius: 50%;
          background: rgba(255,255,255,0.2); flex-shrink: 0; overflow: hidden;
        }
        .msg-avatar img { width:100%; height:100%; object-fit:cover; }
        .msg-bubble {
          padding: 10px 16px; border-radius: 18px;
          font-size: 14px; line-height: 1.5;
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(255,255,255,0.08);
        }
        .message:not(.self) .msg-bubble {
          background: var(--bubble-other);
          border-bottom-left-radius: 6px;
        }
        .message.self .msg-bubble {
          background: linear-gradient(135deg, rgba(107,140,255,0.5), rgba(182,102,255,0.5));
          border-bottom-right-radius: 6px;
          border: 1px solid rgba(255,255,255,0.2);
        }
        .msg-sender { font-size:11px; opacity:0.6; margin-bottom:2px; }
        .msg-time { font-size:10px; opacity:0.4; margin-top:4px; text-align:right; }
        .chat-input-area {
          padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
          display: flex; gap: 10px; align-items: center;
          background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.06);
        }
        .input-glass {
          flex: 1;
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 24px; padding: 12px 18px;
          color: white; font-size: 15px; outline: none;
        }
        .input-glass::placeholder { color: rgba(255,255,255,0.35); }
        .send-btn {
          width: 44px; height: 44px; border-radius: 50%; border: none;
          background: var(--accent-aurora); color: white;
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          opacity: 0.5; pointer-events: none; transform: scale(0.9);
          transition: all 0.3s;
        }
        .send-btn.active { opacity:1; pointer-events:auto; transform:scale(1); }
        .send-btn:active { transform: scale(0.85); }
        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:10px; }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="app-container" id="appContainer">
        <nav class="server-dock" id="serverDock"></nav>
        <div class="channel-panel" id="channelPanel">
            <div class="server-header">
                <div class="server-name" id="serverNameDisplay">Rech</div>
            </div>
            <div class="channel-list" id="channelList"></div>
            <div class="user-strip" id="userStrip">
                <div class="user-strip-avatar" id="userAvatar" onclick="RechNative.navigate('user_info.html')">
                    <div class="online-dot"></div>
                </div>
                <div class="user-strip-info">
                    <div class="user-strip-name" id="userName">加载中...</div>
                    <div class="user-strip-status">在线</div>
                </div>
                <button class="settings-btn" onclick="RechNative.navigate('settings.html')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <span class="chat-title" id="chatTitle"># 频道</span>
            </div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="chat-input-area">
                <input type="text" class="input-glass" id="messageInput" placeholder="发送消息..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== 全局状态 =====
    var API_BASE = '';
    var AUTH_TOKEN = '';
    // 注意：严格按照 Spacebar 的 CDN 拆分
    var USER_CDN_BASE = 'https://cdn.rory.server.spacebar.chat/'; // 用户头像
    var GUILD_CDN_BASE = 'https://cdn.rory.server.spacebar.chat/'; // 服务器/频道图标
    var APP_ICON_URL = 'https://white.echoyyds.cn/RO.png';
    var currentUser = null;
    var servers = [];
    var currentServerId = null;
    var currentChannelId = null;
    var chatOpen = false;
    var allChannels = {};

    // ===== CDN检测 =====
    function detectCDN(apiUrl) {
      // 如果是 Spacebar 官方/子托管，使用专用的 CDN 子域名
      if (apiUrl.indexOf('spacebar.chat') !== -1) {
        return {
          userCdn: 'https://cdn.rory.server.spacebar.chat/',
          guildCdn: 'https://cdn.rory.server.spacebar.chat/'
        };
      }
      // 自搭建服务器：通常 CDN 和 API 在同一主域名下
      var match = apiUrl.match(/^(.+?)\/api\/v\d+/);
      if (match) {
        return {
          userCdn: match[1] + '/',
          guildCdn: match[1] + '/'
        };
      }
      return {
        userCdn: apiUrl.replace(/\/api\/v\d+\/?$/, '/'),
        guildCdn: apiUrl.replace(/\/api\/v\d+\/?$/, '/')
      };
    }

    // ===== 获取用户头像 URL =====
    function getAvatarUrl(userId, avatarHash) {
      if (!userId || !avatarHash) {
        // 返回空，让 HTML 里的 onerror 显示默认占位符
        return '';
      }
      // 处理 GIF 格式的头像
      var ext = avatarHash.startsWith('a_') ? '.gif' : '.png';
      // 完整路径示例：https://cdn.../avatars/12345/abcde.png
      return USER_CDN_BASE + 'avatars/' + userId + '/' + avatarHash + ext;
    }

    // ===== 获取服务器/频道图标 URL =====
    function getIconUrl(guildId, iconHash) {
      if (!guildId || !iconHash) {
        return '';
      }
      var ext = iconHash.startsWith('a_') ? '.gif' : '.png';
      // 完整路径示例：https://cdn.../icons/12345/abcde.png
      return GUILD_CDN_BASE + 'icons/' + guildId + '/' + iconHash + ext;
    }

    // ===== API请求 =====
    function api(path, method, body) {
      var opts = {
        method: method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': AUTH_TOKEN
        }
      };
      if (body) opts.body = JSON.stringify(body);
      return fetch(API_BASE + path, opts)
        .then(function(r) { return r.json().then(function(d) { return {status:r.status, body:d}; }); });
    }

    // ===== 初始化 =====
    window.addEventListener('DOMContentLoaded', function() {
      AUTH_TOKEN = RechNative.getToken();
      var creds = JSON.parse(RechNative.getSavedCredentials() || '{}');
      API_BASE = creds.apiUrl || '';

      var cdns = detectCDN(API_BASE);
      USER_CDN_BASE = cdns.userCdn;
      GUILD_CDN_BASE = cdns.guildCdn;

      if (!AUTH_TOKEN || !API_BASE) {
        RechNative.navigate('auth.html');
        return;
      }
      loadUserData();
    });

    // ===== 加载用户数据 =====
    function loadUserData() {
      api('users/@me').then(function(res) {
        if (res.status === 200) {
          currentUser = res.body;
          document.getElementById('userName').textContent = currentUser.username || currentUser.global_name || '用户';
          var avatarUrl = getAvatarUrl(currentUser.id, currentUser.avatar);
          if (avatarUrl) {
            document.getElementById('userAvatar').innerHTML = '<img src="' + avatarUrl + '" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<div class=online-dot></div>\'"><div class=online-dot></div>';
          }
          loadGuilds();
        } else if (res.status === 401) {
          RechNative.clearCredentials();
          RechNative.navigate('auth.html');
        }
      }).catch(function(e) {
        RechNative.log('加载用户失败: ' + e.message);
      });
    }

    // ===== 加载服务器列表 =====
    function loadGuilds() {
      api('users/@me/guilds').then(function(res) {
        if (res.status === 200) {
          servers = res.body;
          renderServerDock();
          if (servers.length > 0) {
            selectServer(servers[0].id);
          }
        }
      });
    }

    // ===== 渲染服务器图标 =====
    function renderServerDock() {
      var dock = document.getElementById('serverDock');
      dock.innerHTML = '';

      var homeIcon = document.createElement('div');
      homeIcon.className = 'server-icon home-icon';
      homeIcon.style.backgroundImage = 'url(' + APP_ICON_URL + ')';
      homeIcon.style.backgroundSize = 'cover';
      homeIcon.style.backgroundPosition = 'center';
      homeIcon.title = '关于Rech';
      homeIcon.addEventListener('click', function() { RechNative.navigate('app_info.html'); });
      dock.appendChild(homeIcon);

      var sep = document.createElement('div');
      sep.className = 'dock-separator';
      dock.appendChild(sep);

      servers.forEach(function(guild) {
        var el = document.createElement('div');
        el.className = 'server-icon' + (guild.id === currentServerId ? ' active' : '');
        var iconUrl = getIconUrl(guild.id, guild.icon);

        if (iconUrl) {
          el.innerHTML = '<img src="' + iconUrl + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'; this.parentElement.textContent=\'' + (guild.name || '?')[0].toUpperCase() + '\'">';
        } else {
          el.textContent = (guild.name || '?')[0].toUpperCase();
        }
        el.addEventListener('click', function() { selectServer(guild.id); });
        dock.appendChild(el);
      });
    }

    // ===== 渲染消息（重点修复用户头像） =====
    function renderMessages(messages) {
      var area = document.getElementById('messagesArea');
      area.innerHTML = '';

      messages.forEach(function(msg) {
        var el = document.createElement('div');
        var isSelf = msg.author && msg.author.id === (currentUser && currentUser.id);
        el.className = 'message' + (isSelf ? ' self' : '');

        // 头像区域：改用通用函数获取
        var avatarHtml = '<div class="msg-avatar"></div>';
        if (msg.author) {
          var avUrl = getAvatarUrl(msg.author.id, msg.author.avatar);
          if (avUrl) {
            avatarHtml = '<div class="msg-avatar"><img src="' + avUrl + '" onerror="this.style.display=\'none\'"></div>';
          }
        }

        var time = '';
        if (msg.timestamp) {
          var d = new Date(msg.timestamp);
          time = '<div class="msg-time">' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + '</div>';
        }

        el.innerHTML = avatarHtml +
          '<div class="msg-bubble">' +
            '<div class="msg-sender">' + (msg.author ? (msg.author.global_name || msg.author.username) : '未知') + '</div>' +
            (msg.content || '') + time +
          '</div>';
        area.appendChild(el);
      });

      area.scrollTop = area.scrollHeight;
    }
</script>
</body>
</html>
