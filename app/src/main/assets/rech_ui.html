<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 液态玻璃服务器社交</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
          --bg-deep: #0a0a0f;
          --glass-bg: rgba(255,255,255,0.06);
          --glass-border: rgba(255,255,255,0.08);
          --text-primary: rgba(255,255,255,0.92);
          --text-secondary: rgba(255,255,255,0.55);
          --accent-aurora: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          --server-active: rgba(255,255,255,0.2);
          --bubble-other: rgba(255,255,255,0.08);
          --bubble-self: rgba(107,140,255,0.4);
          --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: var(--text-primary);
          height: 100vh; height: 100dvh;
          overflow: hidden;
          display: flex; justify-content: center; align-items: center;
          -webkit-tap-highlight-color: transparent;
          user-select: none; -webkit-user-select: none;
          padding-top: env(safe-area-inset-top, 0px);
        }
        .phone-frame {
          width: 100%; height: 100vh; height: 100dvh;
          background: rgba(10,10,20,0.7);
          backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.6);
          display: flex; flex-direction: column; overflow: hidden;
          position: relative;
        }
        @media (max-width: 599px) { .phone-frame { max-width: 420px; } }
        @media (min-width: 600px) { .phone-frame { max-width: 100%; } }

        .app-container { display:flex; flex:1; height:100%; overflow:hidden; }

        /* 服务器坞 */
        .server-dock {
          width: 72px; min-width: 72px;
          background: rgba(10,10,25,0.5);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border-right: 1px solid rgba(255,255,255,0.06);
          display: flex; flex-direction: column; align-items: center;
          padding: 24px 12px; gap: 10px; overflow: hidden; z-index: 10;
          position: relative;
        }
        .server-dock-scroll {
          flex: 1; overflow-y: auto; overflow-x: hidden;
          display: flex; flex-direction: column; align-items: center;
          gap: 10px; width: 100%; padding-bottom: 8px;
        }
        .server-dock-bottom {
          width: 100%; display: flex; flex-direction: column;
          align-items: center; gap: 8px;
          padding: 8px 0 12px;
          border-top: 1px solid rgba(255,255,255,0.06);
          flex-shrink: 0;
        }
        .server-dock-bottom .server-icon {
          opacity: 0.7; font-size: 24px;
        }
        .server-icon {
          width: 48px; height: 48px; border-radius: 24px;
          background: var(--glass-bg);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border: 1px solid var(--glass-border);
          display: flex; align-items: center; justify-content: center;
          transition: all 0.3s var(--transition-smooth);
          cursor: pointer; flex-shrink: 0; position: relative;
          font-size: 20px; color: rgba(255,255,255,0.8); overflow: hidden;
          min-height: 48px;
        }
        .server-icon.active {
          border-radius: 16px;
          background: var(--server-active);
          border-color: rgba(255,255,255,0.4);
          box-shadow: 0 0 30px rgba(107,140,255,0.4);
        }
        .server-icon.home-icon { background: linear-gradient(135deg, #6b8cff, #b666ff); border: none; }
        .server-icon img { width: 100%; height: 100%; object-fit: cover; }
        .dock-separator { width: 32px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.1); }

        /* 频道面板 */
        .channel-panel {
          display: flex; flex-direction: column;
          background: rgba(15,15,30,0.4);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          overflow: hidden;
        }
        @media (max-width: 599px) { .channel-panel { flex: 1; } }
        @media (min-width: 600px) { .channel-panel { width: 260px; min-width: 260px; border-right: 1px solid rgba(255,255,255,0.06); } }

        .server-header { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .server-name {
          font-size: 22px; font-weight: 700;
          background: var(--accent-aurora);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .channel-list { flex:1; overflow-y:auto; padding:12px 0; min-height: 0; }
        .channel-category {
          padding: 8px 20px 4px; font-size: 11px; font-weight: 600;
          text-transform: uppercase; letter-spacing: 0.8px; color: rgba(255,255,255,0.35);
        }
        .channel-item {
          display: flex; align-items: center; gap: 8px;
          padding: 10px 16px; margin: 2px 8px; border-radius: 12px;
          cursor: pointer; transition: background 0.2s;
          color: var(--text-secondary); font-size: 14px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .channel-item:active { background: rgba(255,255,255,0.08); }
        .channel-item.active { background: rgba(255,255,255,0.1); color: white; }
        .channel-hash { font-weight:700; opacity:0.6; flex-shrink:0; }

        /* 用户信息条 */
        .user-strip {
          padding: 12px 16px; background: rgba(0,0,0,0.35);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border-top: 1px solid rgba(255,255,255,0.08);
          display: flex; align-items: center; gap: 10px;
          flex-shrink: 0;
          z-index: 5;
          min-height: 60px;
        }
        .user-strip-avatar {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.2); cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0;
        }
        .user-strip-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .online-dot {
          position: absolute; bottom: 0; right: 0;
          width: 10px; height: 10px; background: #4ade80; border-radius: 50%;
          border: 2px solid rgba(0,0,0,0.6);
        }
        .user-strip-info { flex: 1; overflow: hidden; }
        .user-strip-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-strip-status { font-size: 11px; color: rgba(255,255,255,0.4); }
        .settings-strip-btn {
          width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
          background: rgba(255,255,255,0.08); border: none; cursor: pointer;
          display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6);
        }

        /* 聊天视图 */
        @media (max-width: 599px) {
          .chat-view { position: absolute; inset: 0; z-index: 20; transform: translateX(100%); }
          .chat-view.open { transform: translateX(0); }
        }
        @media (min-width: 600px) {
          .chat-view { flex: 1; position: relative; transform: none !important; }
          .chat-view .back-btn { display: none; }
        }
        .chat-view {
          display: flex; flex-direction: column;
          background: rgba(15,15,30,0.4);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          transition: transform 0.3s var(--transition-smooth);
        }
        .chat-header {
          padding: 16px 20px; display: flex; align-items: center; gap: 12px;
          border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
        }
        .back-btn {
          width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
          background: rgba(255,255,255,0.08); border: none;
          color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
        }
        .chat-title { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .chat-empty {
          flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          color: rgba(255,255,255,0.3); text-align: center; padding: 40px;
        }
        .chat-empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
        .chat-empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .chat-empty-desc { font-size: 13px; max-width: 300px; line-height: 1.5; }

        .messages-area {
          flex: 1; overflow-y: auto; padding: 20px 16px;
          display: none; flex-direction: column; gap: 8px;
        }
        .messages-area.visible { display: flex; }
        .message {
          display: flex; gap: 10px; max-width: 85%;
          animation: msgIn 0.3s ease-out;
          position: relative; touch-action: pan-y;
        }
        @media (min-width: 600px) { .message { max-width: 75%; } }
        @keyframes msgIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .message.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; overflow: hidden; }
        .msg-avatar img { width:100%; height:100%; object-fit:cover; }
        .msg-bubble {
          padding: 10px 16px; border-radius: 18px;
          font-size: 14px; line-height: 1.5;
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(255,255,255,0.08);
          word-break: break-word; overflow-wrap: break-word;
        }
        .message:not(.self) .msg-bubble { background: var(--bubble-other); border-bottom-left-radius: 6px; }
        .message.self .msg-bubble {
          background: linear-gradient(135deg, rgba(107,140,255,0.5), rgba(182,102,255,0.5));
          border-bottom-right-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
        }
        .msg-sender { font-size:11px; opacity:0.6; margin-bottom:2px; }
        .msg-time { font-size:10px; opacity:0.4; margin-top:4px; text-align:right; }

        .mention {
          color: #c4d9ff;
          background: rgba(88, 101, 242, 0.35);
          padding: 1px 5px; border-radius: 4px;
          font-weight: 500; cursor: pointer; white-space: nowrap;
        }
        .msg-reply-ref {
          font-size: 12px; color: rgba(255,255,255,0.5);
          padding: 4px 8px; margin-bottom: 6px;
          border-left: 3px solid #6b8cff;
          background: rgba(107,140,255,0.1);
          border-radius: 0 6px 6px 0;
          cursor: pointer;
          max-width: 220px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .reactions-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .reaction-badge {
          display: flex; align-items: center; gap: 3px;
          padding: 2px 8px;
          background: rgba(107,140,255,0.15);
          border: 1px solid rgba(107,140,255,0.25);
          border-radius: 10px; font-size: 12px; cursor: pointer;
        }
        .reaction-badge.active { background: rgba(107,140,255,0.4); border-color: #6b8cff; }
        .reaction-count { font-size: 11px; color: rgba(255,255,255,0.7); }

        .embed-card {
          margin-top: 8px; background: rgba(0,0,0,0.3);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 8px; overflow: hidden;
          border-left: 4px solid #6b8cff;
        }
        .embed-card .embed-image { width: 100%; max-height: 200px; object-fit: cover; display: block; }
        .embed-card .embed-body { padding: 10px 12px; }
        .embed-card .embed-title { font-size: 14px; font-weight: 600; color: #8bb8ff; margin-bottom: 4px; }
        .embed-card .embed-desc { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; }

        .msg-image { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 6px; cursor: pointer; }

        /* 输入区域 */
        .chat-input-wrapper {
          flex-shrink: 0;
          background: rgba(0,0,0,0.35);
          border-top: 1px solid rgba(255,255,255,0.06);
          display: none; flex-direction: column;
          padding-bottom: env(safe-area-inset-bottom, 12px);
        }
        .chat-input-wrapper.visible { display: flex; }

        .reply-preview {
          display: none; align-items: center; gap: 8px;
          padding: 8px 16px; background: rgba(0,0,0,0.2);
          border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .reply-preview.visible { display: flex; }
        .reply-preview-bar { width: 3px; height: 20px; background: #6b8cff; border-radius: 2px; flex-shrink: 0; }
        .reply-preview-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: rgba(255,255,255,0.5); }
        .reply-preview-close { cursor: pointer; color: rgba(255,255,255,0.5); font-size: 18px; padding: 4px; }

        .chat-input-row { display: flex; gap: 10px; align-items: center; padding: 8px 16px 16px; }
        .input-glass {
          flex: 1; min-width: 0;
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 24px; padding: 12px 18px;
          color: white; font-size: 15px; outline: none;
        }
        .input-glass::placeholder { color: rgba(255,255,255,0.35); }
        .send-btn {
          width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
          background: var(--accent-aurora); color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          opacity: 0.5; pointer-events: none; transform: scale(0.9);
          transition: all 0.3s;
        }
        .send-btn.active { opacity:1; pointer-events:auto; transform:scale(1); }
        .send-btn:active { transform: scale(0.85); }

        /* 弹窗 */
        .msg-context-menu {
          position: fixed;
          background: rgba(20,20,40,0.95);
          backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 14px; padding: 6px; z-index: 200;
          min-width: 160px;
          box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .msg-context-menu-item {
          display: flex; align-items: center; gap: 10px;
          padding: 10px 14px; border-radius: 10px;
          font-size: 14px; color: rgba(255,255,255,0.8); cursor: pointer;
        }
        .msg-context-menu-item:active { background: rgba(255,255,255,0.1); }

        .emoji-picker {
          position: fixed; bottom: 0; left: 0; right: 0;
          background: rgba(20,20,40,0.97);
          backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          border-top: 1px solid rgba(255,255,255,0.1);
          padding: 16px; z-index: 250;
          border-radius: 20px 20px 0 0; display: none;
          max-height: 50%; overflow-y: auto;
        }
        .emoji-picker.open { display: block; }
        .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .emoji-btn {
          width: 44px; height: 44px; font-size: 24px;
          display: flex; align-items: center; justify-content: center;
          border-radius: 10px; cursor: pointer; background: none; border: none;
        }
        .emoji-btn:hover { background: rgba(255,255,255,0.1); }

        .glass-modal-overlay {
          position: fixed; inset: 0; z-index: 300;
          background: rgba(0,0,0,0.6);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          display: none; align-items: center; justify-content: center;
        }
        .glass-modal-overlay.open { display: flex; }
        .glass-modal {
          width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
          background: rgba(20,20,40,0.95);
          backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 20px; padding: 24px;
        }
        .glass-modal h2 {
          font-size: 20px; font-weight: 700; margin-bottom: 16px;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .glass-modal .input-group { margin-bottom: 12px; }
        .glass-modal label { display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .glass-modal .glass-input {
          width: 100%; padding: 12px 16px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.12);
          background: rgba(255,255,255,0.06); color: white;
          font-size: 15px; outline: none;
        }
        .glass-modal .btn-primary {
          width: 100%; padding: 12px; border-radius: 12px; border: none;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .glass-modal .btn-secondary {
          width: 100%; padding: 12px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.15);
          background: transparent; color: rgba(255,255,255,0.7);
          font-size: 14px; cursor: pointer; margin-top: 6px;
        }

        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:10px; }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="app-container" id="appContainer">

        <!-- 服务器坞 -->
        <nav class="server-dock" id="serverDock">
            <div class="server-dock-scroll" id="serverDockScroll"></div>
            <div class="server-dock-bottom">
                <div class="server-icon" onclick="showJoinServerModal()" title="加入服务器">➕</div>
                <div class="server-icon" onclick="RechNative.navigate('discover.html')" title="发现服务器">🔍</div>
            </div>
        </nav>

        <!-- 频道面板 -->
        <div class="channel-panel" id="channelPanel">
            <div class="server-header"><div class="server-name" id="serverNameDisplay">Rech</div></div>
            <div class="channel-list" id="channelList"></div>
            <!-- 用户信息条 -->
            <div class="user-strip">
                <div class="user-strip-avatar" id="userAvatar" onclick="RechNative.navigate('user_info.html')"><div class="online-dot"></div></div>
                <div class="user-strip-info">
                    <div class="user-strip-name" id="userName">加载中...</div>
                    <div class="user-strip-status" id="userStatus">在线</div>
                </div>
                <button class="settings-strip-btn" onclick="RechNative.navigate('settings.html')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                </button>
            </div>
        </div>

        <!-- 聊天视图 -->
        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <button class="back-btn" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                <span class="chat-title" id="chatTitle">选择频道开始聊天</span>
            </div>
            <div id="chatEmpty" class="chat-empty">
                <div class="chat-empty-icon">💬</div>
                <div class="chat-empty-title">欢迎来到 Rech</div>
                <div class="chat-empty-desc">选择一个文字频道开始聊天</div>
            </div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="chat-input-wrapper" id="chatInputWrapper">
                <div class="reply-preview" id="replyPreview">
                    <div class="reply-preview-bar"></div>
                    <div class="reply-preview-text" id="replyPreviewText">回复消息</div>
                    <span class="reply-preview-close" onclick="cancelReply()">✕</span>
                </div>
                <div class="chat-input-row">
                    <input type="text" class="input-glass" id="messageInput" placeholder="发送消息..." autocomplete="off">
                    <button class="send-btn" id="sendBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- 消息菜单 -->
<div class="msg-context-menu" id="msgContextMenu" style="display:none;">
    <div class="msg-context-menu-item" onclick="showEmojiPicker()">😊 添加表情回应</div>
    <div class="msg-context-menu-item" onclick="replyToMessage()">↩️ 引用回复</div>
    <div class="msg-context-menu-item" onclick="copyMessageContent()">📋 复制消息</div>
    <div class="msg-context-menu-item" onclick="deleteOwnMessage()">🗑️ 撤回</div>
</div>

<!-- 表情选择器 -->
<div class="emoji-picker" id="emojiPicker">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;align-items:center;">
        <span style="color:rgba(255,255,255,0.7);font-size:13px;">选择表情回应</span>
        <button onclick="closeEmojiPicker()" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div class="emoji-grid" id="emojiGrid"></div>
</div>

<!-- 加入服务器弹窗 -->
<div class="glass-modal-overlay" id="joinModal">
    <div class="glass-modal">
        <h2>加入服务器</h2>
        <div class="input-group"><label>邀请链接或邀请码</label>
            <input class="glass-input" id="inviteInput" type="text" placeholder="https://discord.gg/xxx 或 xxx">
        </div>
        <button class="btn-primary" onclick="joinServerByInvite()">加入</button>
        <button class="btn-secondary" onclick="showCreateServerModal()">创建服务器</button>
        <button class="btn-secondary" onclick="closeJoinModal()">取消</button>
    </div>
</div>

<!-- 创建服务器弹窗 -->
<div class="glass-modal-overlay" id="createModal">
    <div class="glass-modal">
        <h2>创建服务器</h2>
        <div class="input-group"><label>服务器名称</label>
            <input class="glass-input" id="createName" type="text" placeholder="我的服务器">
        </div>
        <div class="input-group"><label>服务器图标URL</label>
            <input class="glass-input" id="createIcon" type="text" placeholder="https://example.com/icon.png（可选）">
        </div>
        <button class="btn-primary" onclick="createServer()">创建</button>
        <button class="btn-secondary" onclick="closeCreateModal()">取消</button>
    </div>
</div>

<script>
    // ===== 替换原生弹窗 =====
    window.alert = function(msg) { showCustomDialog('Rech', msg, [{text:'确定', primary:true, callback:function(){}}]); };
    function showCustomDialog(title, message, buttons) {
      var old = document.querySelector('.custom-dialog-overlay');
      if (old) old.remove();
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:9999;display:flex;align-items:center;justify-content:center;';
      var btnHtml = '';
      buttons.forEach(function(btn, i) {
        btnHtml += '<button style="flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;' + (btn.primary ? 'background:linear-gradient(135deg,#6b8cff,#b666ff);color:white;' : 'background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1);') + '" data-idx="'+i+'">'+btn.text+'</button>';
      });
      overlay.innerHTML = '<div style="width:85%;max-width:320px;background:rgba(20,20,40,0.95);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:24px;text-align:center;"><div style="font-size:18px;font-weight:700;margin-bottom:12px;background:linear-gradient(135deg,#6b8cff,#b666ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">'+title+'</div><div style="font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:20px;line-height:1.6;white-space:pre-line;">'+message+'</div><div style="display:flex;gap:10px;">'+btnHtml+'</div></div>';
      document.body.appendChild(overlay);
      overlay.querySelectorAll('button').forEach(function(el) {
        el.addEventListener('click', function() {
          var idx = parseInt(this.getAttribute('data-idx'));
          overlay.remove();
          if (buttons[idx] && buttons[idx].callback) buttons[idx].callback();
        });
      });
    }

    // ===== 全局状态 =====
    var API_BASE = '', AUTH_TOKEN = '';
    var USER_CDN_BASE = 'https://cdn.rory.server.spacebar.chat/';
    var GUILD_CDN_BASE = 'https://cdn.rory.server.spacebar.chat/';
    var APP_ICON_URL = 'http://white.echoyyds.cn/RO.png';
    var currentUser = null, servers = [], currentServerId = null, currentChannelId = null;
    var allChannels = {};
    var isTablet = window.innerWidth >= 600;
    var contextMenuMsgId = null, replyMessageId = null;
    var messagePollTimer = null;
    var COMMON_EMOJIS = ['👍','❤️','😂','😮','😢','😡','🎉','🔥','👀','💯','✅','❌','⭐','🤔','🙏','👋','🤖','💻','🎮','📡'];

    window.addEventListener('resize', function() { isTablet = window.innerWidth >= 600; });

    function detectCDN(apiUrl) {
      if (apiUrl.indexOf('spacebar.chat') !== -1) return { userCdn: 'https://cdn.rory.server.spacebar.chat/', guildCdn: 'https://cdn.rory.server.spacebar.chat/' };
      var m = apiUrl.match(/^(.+?)\/api\/v\d+/);
      if (m) return { userCdn: m[1] + '/', guildCdn: m[1] + '/' };
      var b = apiUrl.replace(/\/api\/v\d+\/?$/, '/');
      return { userCdn: b, guildCdn: b };
    }
    function getAvatarUrl(uid, hash) { return (!uid||!hash) ? '' : USER_CDN_BASE + 'avatars/' + uid + '/' + hash + (hash.startsWith('a_') ? '.gif' : '.png'); }
    function getIconUrl(gid, hash) { return (!gid||!hash) ? '' : GUILD_CDN_BASE + 'icons/' + gid + '/' + hash + (hash.startsWith('a_') ? '.gif' : '.png'); }

    function api(path, method, body) {
      var opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': AUTH_TOKEN } };
      if (body) opts.body = JSON.stringify(body);
      return fetch(API_BASE + path, opts).then(function(r) { return r.json().then(function(d) { return {status: r.status, body: d}; }); }).catch(function() { return {status: 0, body: {}}; });
    }

    // ===== 实时消息轮询（8秒） =====
    function startMessagePoll() {
      stopMessagePoll();
      if (!currentChannelId) return;
      messagePollTimer = setInterval(function() {
        if (currentChannelId) loadMessages(currentChannelId);
      }, 10000);
    }
    function stopMessagePoll() {
      if (messagePollTimer) { clearInterval(messagePollTimer); messagePollTimer = null; }
    }

    // ===== 解析内容 =====
    function parseContent(content, msg) {
      if (!content) return '';
      var h = content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      h = h.replace(/&lt;@!?(\d+)&gt;/g, function(m, uid) {
        var name = '@用户';
        if (msg && msg.mentions) { for (var i = 0; i < msg.mentions.length; i++) { if (msg.mentions[i].id === uid) { name = '@' + (msg.mentions[i].global_name || msg.mentions[i].username); break; } } }
        return '<span class="mention">' + name + '</span>';
      });
      h = h.replace(/&lt;:(.+?):(\d+)&gt;/g, function(m, n, id) { return '<img src="' + GUILD_CDN_BASE + 'emojis/' + id + '.png" alt=":' + n + ':" style="width:20px;height:20px;vertical-align:middle;">'; });
      h = h.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
        url = url.replace(/&amp;/g, '&');
        if (/\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i.test(url)) return '<br><img src="' + url + '" class="msg-image" onclick="window.open(\'' + url + '\')">';
        return '<a href="' + url + '" style="color:#8bb8ff;" target="_blank">' + decodeURI(url).substring(0, 50) + (url.length > 50 ? '...' : '') + '</a>';
      });
      return h;
    }
    function renderAttachments(atts) {
      if (!atts || !atts.length) return '';
      var h = ''; atts.forEach(function(a) { if (a.content_type && a.content_type.indexOf('image') !== -1) h += '<img src="' + a.url + '" class="msg-image">'; else h += '<div style="margin-top:6px;padding:8px;background:rgba(255,255,255,0.05);border-radius:8px;font-size:12px;">📎 <a href="' + a.url + '" style="color:#8bb8ff;" target="_blank">' + (a.filename||'附件') + '</a></div>'; });
      return h;
    }
    function renderEmbeds(embs) {
      if (!embs || !embs.length) return '';
      var h = ''; embs.forEach(function(e) {
        h += '<div class="embed-card">';
        if (e.thumbnail && e.thumbnail.url) h += '<img src="' + e.thumbnail.url + '" class="embed-image">';
        if (e.image && e.image.url) h += '<img src="' + e.image.url + '" class="embed-image">';
        h += '<div class="embed-body">';
        if (e.title) h += '<div class="embed-title">' + (e.url ? '<a href="' + e.url + '" target="_blank">' + e.title + '</a>' : e.title) + '</div>';
        if (e.description) h += '<div class="embed-desc">' + e.description + '</div>';
        h += '</div></div>';
      });
      return h;
    }
    function renderReactions(rs) {
      if (!rs || !rs.length) return '';
      var h = '<div class="reactions-bar">';
      rs.forEach(function(r) { h += '<div class="reaction-badge' + (r.me ? ' active' : '') + '" onclick="toggleReaction(\'' + r.emoji.name + '\')">' + r.emoji.name + ' <span class="reaction-count">' + r.count + '</span></div>'; });
      return h + '</div>';
    }

    // ===== 初始化 =====
    window.addEventListener('DOMContentLoaded', function() {
      isTablet = window.innerWidth >= 600;
      AUTH_TOKEN = RechNative.getToken();
      var creds = JSON.parse(RechNative.getSavedCredentials() || '{}');
      API_BASE = creds.apiUrl || '';
      var cdns = detectCDN(API_BASE);
      USER_CDN_BASE = cdns.userCdn; GUILD_CDN_BASE = cdns.guildCdn;
      if (!AUTH_TOKEN || !API_BASE) { RechNative.navigate('auth.html'); return; }
      loadUserData();
      initEmojiPicker();
    });

    function initEmojiPicker() {
      var g = document.getElementById('emojiGrid'); g.innerHTML = '';
      COMMON_EMOJIS.forEach(function(e) { var b = document.createElement('button'); b.className = 'emoji-btn'; b.textContent = e; b.addEventListener('click', function() { addReaction(e); closeEmojiPicker(); }); g.appendChild(b); });
    }

    // ===== 加载用户数据 =====
    function loadUserData() {
      api('users/@me').then(function(res) {
        if (res.status === 200) {
          currentUser = res.body;
          // 更新用户信息条
          var userName = currentUser.global_name || currentUser.username || '用户';
          document.getElementById('userName').textContent = userName;
          var statusText = '在线';
          if (currentUser.presence) {
            if (currentUser.presence.status === 'idle') statusText = '空闲';
            else if (currentUser.presence.status === 'dnd') statusText = '请勿打扰';
            else if (currentUser.presence.status === 'offline') statusText = '离线';
          }
          document.getElementById('userStatus').textContent = statusText;

          var au = getAvatarUrl(currentUser.id, currentUser.avatar);
          var ae = document.getElementById('userAvatar');
          ae.innerHTML = (au ? '<img src="' + au + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.style.display=\'none\'">' : '') + '<div class="online-dot"></div>';

          loadGuilds();
        } else if (res.status === 401) { RechNative.clearCredentials(); RechNative.navigate('auth.html'); }
      });
    }

    function loadGuilds() {
      api('users/@me/guilds').then(function(res) {
        if (res.status === 200 && Array.isArray(res.body)) { servers = res.body; renderServerDock(); if (servers.length) selectServer(servers[0].id); }
      });
    }

    function renderServerDock() {
      var s = document.getElementById('serverDockScroll'); s.innerHTML = '';
      var h = document.createElement('div'); h.className = 'server-icon home-icon';
      h.style.backgroundImage = 'url(' + APP_ICON_URL + ')'; h.style.backgroundSize = 'cover'; h.style.backgroundPosition = 'center';
      h.addEventListener('click', function() { RechNative.navigate('app_info.html'); }); s.appendChild(h);
      var sep = document.createElement('div'); sep.className = 'dock-separator'; s.appendChild(sep);
      servers.forEach(function(g) {
        var el = document.createElement('div'); el.className = 'server-icon' + (g.id === currentServerId ? ' active' : '');
        var iu = getIconUrl(g.id, g.icon);
        el.innerHTML = iu ? '<img src="' + iu + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (g.name||'?')[0].toUpperCase() + '\'">' : (g.name||'?')[0].toUpperCase();
        el.setAttribute('data-guild-id', g.id);
        el.addEventListener('click', function() { selectServer(g.id); }); s.appendChild(el);
      });
    }

    function selectServer(gid) {
      currentServerId = gid; currentChannelId = null;
      showEmptyState(); stopMessagePoll();
      var g = servers.find(function(s) { return s.id === gid; });
      document.getElementById('serverNameDisplay').textContent = g ? g.name : 'Rech';
      document.querySelectorAll('#serverDockScroll .server-icon').forEach(function(el) { el.classList.toggle('active', el.getAttribute('data-guild-id') === gid); });
      if (allChannels[gid]) renderChannelList(allChannels[gid]);
      else api('guilds/' + gid + '/channels').then(function(res) { if (res.status === 200 && Array.isArray(res.body)) { allChannels[gid] = res.body; renderChannelList(res.body); } });
    }

    function renderChannelList(chs) {
      var l = document.getElementById('channelList'); l.innerHTML = '';
      var t = [], v = [];
      chs.forEach(function(c) { if (c.type === 2 || c.type === 13) v.push(c); else t.push(c); });
      function rc(title, arr) {
        if (!arr.length) return;
        var h = document.createElement('div'); h.className = 'channel-category'; h.textContent = title; l.appendChild(h);
        arr.forEach(function(c) {
          var i = document.createElement('div'); i.className = 'channel-item';
          i.innerHTML = (c.type===2||c.type===13 ? '🔊 ' : '<span class="channel-hash">#</span> ') + (c.name||'未命名');
          i.setAttribute('data-channel-id', c.id); i.title = c.name;
          i.addEventListener('click', function(e) { openChannel(c, e); }); l.appendChild(i);
        });
      }
      rc('文字频道', t); rc('语音频道', v);
    }

    function showEmptyState() {
      document.getElementById('chatTitle').textContent = '选择频道开始聊天';
      document.getElementById('chatEmpty').style.display = 'flex';
      document.getElementById('messagesArea').classList.remove('visible');
      document.getElementById('chatInputWrapper').classList.remove('visible');
      cancelReply(); currentChannelId = null;
    }

    function openChannel(ch, ev) {
      currentChannelId = ch.id;
      document.getElementById('chatTitle').textContent = ((ch.type===2||ch.type===13)?'🔊 ':'# ') + (ch.name||'频道');
      document.getElementById('chatEmpty').style.display = 'none';
      document.getElementById('messagesArea').classList.add('visible');
      document.getElementById('chatInputWrapper').classList.add('visible');
      document.getElementById('messageInput').value = '';
      updateSendBtn(); cancelReply();
      if (!isTablet) document.getElementById('chatView').classList.add('open');
      document.querySelectorAll('.channel-item').forEach(function(el) { el.classList.remove('active'); });
      if (ev && ev.currentTarget) ev.currentTarget.classList.add('active');
      loadMessages(ch.id); startMessagePoll();
    }

    function loadMessages(cid) {
      var area = document.getElementById('messagesArea');
      api('channels/' + cid + '/messages?limit=50').then(function(r) {
        if (r.status === 200 && Array.isArray(r.body)) renderMessages(r.body.slice().reverse());
        else if (area.querySelector('.msg-bubble') === null) area.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px;">暂无消息</div>';
      });
    }

    function renderMessages(ms) {
      var area = document.getElementById('messagesArea');
      var wasAtBottom = (area.scrollHeight - area.scrollTop - area.clientHeight) < 100;
      area.innerHTML = '';
      if (!ms.length) { area.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:40px;">暂无消息</div>'; return; }
      ms.forEach(function(m) {
        var el = document.createElement('div');
        el.className = 'message' + (m.author && m.author.id === (currentUser&&currentUser.id) ? ' self' : '');
        el.setAttribute('data-msg-id', m.id);
        el.setAttribute('data-author-id', m.author ? m.author.id : '');

        var replyH = '';
        if (m.message_reference && m.message_reference.message_id) {
          var refContent = '回复了某条消息';
          if (m.referenced_message) {
            var refAuthor = m.referenced_message.author ? (m.referenced_message.author.global_name || m.referenced_message.author.username) : '用户';
            var refText = (m.referenced_message.content || '').substring(0, 30);
            refContent = refAuthor + ': ' + refText + (m.referenced_message.content && m.referenced_message.content.length > 30 ? '...' : '');
          }
          replyH = '<div class="msg-reply-ref" onclick="jumpToMessage(\'' + m.message_reference.message_id + '\')">' + refContent + '</div>';
        }

        var av = (m.author && m.author.avatar) ? getAvatarUrl(m.author.id, m.author.avatar) : '';
        var ah = av ? '<div class="msg-avatar"><img src="' + av + '" onerror="this.style.display=\'none\'"></div>' : '<div class="msg-avatar"></div>';
        var tm = ''; if (m.timestamp) { var d = new Date(m.timestamp); tm = '<div class="msg-time">' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0') + '</div>'; }

        el.innerHTML = ah + '<div class="msg-bubble">' + replyH + '<div class="msg-sender">' + (m.author ? (m.author.global_name||m.author.username) : '未知') + '</div>' + parseContent(m.content, m) + renderAttachments(m.attachments) + renderEmbeds(m.embeds) + renderReactions(m.reactions) + tm + '</div>';

        var pressTimer;
        el.addEventListener('touchstart', function(e) {
          if (e.target.tagName === 'IMG' || e.target.tagName === 'A') return;
          el._startX = e.touches[0].clientX; el._swiped = false;
          pressTimer = setTimeout(function() { contextMenuMsgId = m.id; showContextMenu(e); }, 500);
        });
        el.addEventListener('touchend', function() { clearTimeout(pressTimer); });
        el.addEventListener('touchmove', function(e) {
          clearTimeout(pressTimer);
          var dx = e.touches[0].clientX - (el._startX || e.touches[0].clientX);
          if (dx < -60 && !el._swiped) { el._swiped = true; replyMessageId = m.id; showReplyPreview(m); }
        });
        area.appendChild(el);
      });
      if (wasAtBottom) area.scrollTop = area.scrollHeight;
    }

    // ===== 消息菜单 =====
    function showContextMenu(e) {
      var menu = document.getElementById('msgContextMenu');
      var t = e.touches[0] || e.changedTouches[0];
      menu.style.display = 'block';
      menu.style.left = Math.min(t.clientX, window.innerWidth - 180) + 'px';
      menu.style.top = (t.clientY - 120) + 'px';
      var msgEl = document.querySelector('[data-msg-id="' + contextMenuMsgId + '"]');
      var selfAuth = msgEl && msgEl.getAttribute('data-author-id') === currentUser.id;
      menu.children[3].style.display = selfAuth ? 'flex' : 'none';
    }
    function hideContextMenu() { document.getElementById('msgContextMenu').style.display = 'none'; }
    function replyToMessage() { replyMessageId = contextMenuMsgId; var el = document.querySelector('[data-msg-id="' + contextMenuMsgId + '"]'); if (el) { var s = el.querySelector('.msg-sender'); var c = s ? s.textContent : '用户'; var t = el.querySelector('.msg-bubble').textContent.trim().substring(0, 50); showReplyPreview({author:{global_name:c}, content:t, id:contextMenuMsgId}); } hideContextMenu(); }
    function copyMessageContent() { var el = document.querySelector('[data-msg-id="' + contextMenuMsgId + '"]'); if (el) { var c = el.querySelector('.msg-bubble').textContent.trim(); navigator.clipboard.writeText(c).then(function() { showCustomDialog('复制', '已复制到剪贴板', [{text:'确定',primary:true,callback:function(){}}]); }); } hideContextMenu(); }
    function deleteOwnMessage() { showCustomDialog('撤回', '确定撤回这条消息吗？', [{text:'取消',primary:false,callback:function(){}},{text:'确定',primary:true,callback:function(){ api('channels/'+currentChannelId+'/messages/'+contextMenuMsgId,'DELETE').then(function(r){ if(r.status===200||r.status===204) loadMessages(currentChannelId); }); }}]); hideContextMenu(); }

    // ===== 表情 =====
    function showEmojiPicker() { hideContextMenu(); document.getElementById('emojiPicker').classList.add('open'); }
    function closeEmojiPicker() { document.getElementById('emojiPicker').classList.remove('open'); }
    function addReaction(emojiName) {
      if (!currentChannelId || !contextMenuMsgId) return;
      api('channels/' + currentChannelId + '/messages/' + contextMenuMsgId + '/reactions/' + encodeURIComponent(emojiName) + '/@me', 'PUT').then(function(r) { if (r.status === 204 || r.status === 200) loadMessages(currentChannelId); });
    }
    function toggleReaction(emojiName) {
      if (!currentChannelId || !contextMenuMsgId) return;
      api('channels/' + currentChannelId + '/messages/' + contextMenuMsgId + '/reactions/' + encodeURIComponent(emojiName) + '/@me', 'DELETE').then(function() { loadMessages(currentChannelId); });
    }

    // ===== 引用 =====
    function showReplyPreview(msg) {
      document.getElementById('replyPreview').classList.add('visible');
      var name = msg.author ? (msg.author.global_name || msg.author.username) : '用户';
      document.getElementById('replyPreviewText').textContent = '回复 ' + name + ': ' + (msg.content || '').substring(0, 50);
      document.getElementById('messageInput').focus();
      updateSendBtn();
    }
    function cancelReply() { replyMessageId = null; document.getElementById('replyPreview').classList.remove('visible'); updateSendBtn(); }
    function jumpToMessage(msgId) { var el = document.querySelector('[data-msg-id="' + msgId + '"]'); if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background = 'rgba(107,140,255,0.2)'; setTimeout(function() { el.style.background = ''; }, 2000); } }

    // ===== 发送 =====
    function doSendMessage() {
      if (!currentChannelId) return;
      var inp = document.getElementById('messageInput'), txt = inp.value.trim();
      if (!txt && !replyMessageId) return;
      var body = { content: txt };
      if (replyMessageId) body.message_reference = { message_id: replyMessageId, channel_id: currentChannelId };
      var btn = document.getElementById('sendBtn'); btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
      api('channels/' + currentChannelId + '/messages', 'POST', body).then(function(r) {
        if (r.status === 200) { inp.value = ''; updateSendBtn(); cancelReply(); loadMessages(currentChannelId); }
        btn.style.opacity = ''; btn.style.pointerEvents = '';
      });
    }
    document.getElementById('sendBtn').addEventListener('click', doSendMessage);
    document.getElementById('messageInput').addEventListener('input', updateSendBtn);
    document.getElementById('messageInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') doSendMessage(); });
    function updateSendBtn() { document.getElementById('sendBtn').classList.toggle('active', !!document.getElementById('messageInput').value.trim() || !!replyMessageId); }

    document.getElementById('backBtn').addEventListener('click', function() {
      if (!isTablet) document.getElementById('chatView').classList.remove('open');
      showEmptyState(); stopMessagePoll();
      document.querySelectorAll('.channel-item').forEach(function(el) { el.classList.remove('active'); });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.msg-context-menu')) hideContextMenu();
      if (!e.target.closest('.emoji-picker') && !e.target.closest('.msg-context-menu-item')) closeEmojiPicker();
    });

    // ===== 加入/创建服务器 =====
    function showJoinServerModal() { document.getElementById('joinModal').classList.add('open'); }
    function closeJoinModal() { document.getElementById('joinModal').classList.remove('open'); }
    function showCreateServerModal() { closeJoinModal(); document.getElementById('createModal').classList.add('open'); }
    function closeCreateModal() { document.getElementById('createModal').classList.remove('open'); }

    function joinServerByInvite() {
      var inp = document.getElementById('inviteInput').value.trim();
      if (!inp) return;
      var code = inp;
      var m = inp.match(/(?:discord\.gg|invite)\/(\w+)/i);
      if (m) code = m[1];
      api('invites/' + code).then(function(r) {
        if (r.status === 200 && r.body.code) {
          api('invites/' + r.body.code, 'POST').then(function(r2) {
            if (r2.status === 200 || r2.status === 201) {
              closeJoinModal();
              loadGuilds();
              showCustomDialog('成功', '已加入服务器', [{text:'确定',primary:true,callback:function(){}}]);
            } else { showCustomDialog('错误', '加入失败', [{text:'确定',primary:true,callback:function(){}}]); }
          });
        } else { showCustomDialog('错误', '邀请码无效', [{text:'确定',primary:true,callback:function(){}}]); }
      });
    }

    function createServer() {
      var name = document.getElementById('createName').value.trim();
      var icon = document.getElementById('createIcon').value.trim();
      if (!name) return;
      var body = { name: name };
      if (icon) body.icon = icon;
      api('guilds', 'POST', body).then(function(r) {
        if (r.status === 200 || r.status === 201) {
          closeCreateModal();
          loadGuilds();
          showCustomDialog('成功', '服务器已创建', [{text:'确定',primary:true,callback:function(){}}]);
