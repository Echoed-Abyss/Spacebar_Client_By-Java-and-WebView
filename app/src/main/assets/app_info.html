<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 关于</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%); color: rgba(255,255,255,0.9); min-height: 100vh; padding: 20px; -webkit-tap-highlight-color: transparent; }
        .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .back-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .title { font-size: 20px; font-weight: 700; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
        .app-icon-area { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .app-icon { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d); display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; }
        .app-name { font-size: 24px; font-weight: 700; }
        .app-version { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        /* 自定义弹窗 */
.custom-dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.custom-dialog {
  width: 85%; max-width: 320px;
  background: rgba(20,20,40,0.9);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
}
.custom-dialog-title {
  font-size: 18px; font-weight: 700; margin-bottom: 12px;
  background: linear-gradient(135deg, #6b8cff, #b666ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.custom-dialog-message {
  font-size: 14px; color: rgba(255,255,255,0.7);
  margin-bottom: 20px; line-height: 1.6; white-space: pre-line;
}
.custom-dialog-buttons {
  display: flex; gap: 10px;
}
.custom-dialog-btn {
  flex: 1; padding: 12px; border-radius: 12px;
  border: none; font-size: 14px; font-weight: 600; cursor: pointer;
}
.custom-dialog-btn.primary {
  background: linear-gradient(135deg, #6b8cff, #b666ff);
  color: white;
}
.custom-dialog-btn.secondary {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.1);
}
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .info-row .label { color: rgba(255,255,255,0.5); }
        .info-row .value { color: rgba(255,255,255,0.8); }
        .link { color: #6b8cff; text-decoration: none; cursor: pointer; }
        .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin: 20px 0 12px; }
        .dev-card { display: flex; gap: 14px; align-items: center; padding: 16px; margin-bottom: 10px; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .dev-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.2); overflow: hidden; flex-shrink: 0; }
        .dev-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .dev-info { flex: 1; }
        .dev-name { font-size: 15px; font-weight: 600; }
        .dev-role { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .dev-bio { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
        .dev-github { margin-top: 8px; font-size: 12px; }
        .dev-github a { color: #6b8cff; text-decoration: none; }
        .powered-by { text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 24px; padding-bottom: 40px; }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <span class="title">关于 Rech</span>
</div>
<div class="glass-card">
    <div class="app-icon-area"><div class="app-icon">R</div><div><div class="app-name">Rech</div><div class="app-version" id="appVersion">加载中...</div></div></div>
    <div class="info-row"><span class="label">构建版本</span><span class="value" id="buildNumber">-</span></div>
    <div class="info-row"><span class="label">开源地址</span><span class="value"><a class="link" id="openSourceLink" href="#" onclick="openLink(this.href)">-</a></span></div>
</div>
<div class="section-title">开发团队</div>
<div id="devList"><div style="text-align:center;padding:40px;color:rgba(255,255,255,0.4);">加载中...</div></div>
<div class="powered-by" id="poweredBy">Powered by Spacebar API</div>
<script>
    // 替换原生alert
window.originalAlert = window.alert;
window.alert = function(msg) {
  showCustomDialog('Rech', msg, [{text:'确定', primary:true, callback:function(){}}]);
};

// 替换原生confirm
window.originalConfirm = window.confirm;
window.confirm = function(msg) {
  return new Promise(function(resolve) {
    showCustomDialog('Rech', msg, [
      {text:'取消', primary:false, callback:function(){ resolve(false); }},
      {text:'确定', primary:true, callback:function(){ resolve(true); }}
    ]);
  });
};

function showCustomDialog(title, message, buttons) {
  var old = document.querySelector('.custom-dialog-overlay');
  if (old) old.remove();

  var overlay = document.createElement('div');
  overlay.className = 'custom-dialog-overlay';

  var btnHtml = '<div class="custom-dialog-buttons">';
  buttons.forEach(function(btn, i) {
    btnHtml += '<button class="custom-dialog-btn ' + (btn.primary ? 'primary' : 'secondary') + '" data-idx="' + i + '">' + btn.text + '</button>';
  });
  btnHtml += '</div>';

  overlay.innerHTML = '<div class="custom-dialog">' +
    '<div class="custom-dialog-title">' + title + '</div>' +
    '<div class="custom-dialog-message">' + message + '</div>' +
    btnHtml +
  '</div>';

  document.body.appendChild(overlay);

  overlay.querySelectorAll('.custom-dialog-btn').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      overlay.remove();
      if (buttons[idx] && buttons[idx].callback) buttons[idx].callback();
    });
  });
}
    function compareVersion(v1, v2) {
      if (!v1 || !v2) return 0;
      var a1 = v1.split('.'), a2 = v2.split('.'), len = Math.max(a1.length, a2.length);
      for (var i = 0; i < len; i++) { var n1 = parseInt(a1[i]||'0'), n2 = parseInt(a2[i]||'0'); if (n1 > n2) return 1; if (n1 < n2) return -1; }
      return 0;
    }
    function openLink(url) { try { RechNative.openUrl(url); } catch(e) { window.open(url, '_blank'); } }

    window.addEventListener('DOMContentLoaded', function() {
      try { document.getElementById('appVersion').textContent = 'v' + RechNative.getAppVersion(); } catch(e) {}
      var url = RechNative.getVersionCheckUrl();
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        document.getElementById('buildNumber').textContent = data.build_number || '-';
        document.getElementById('openSourceLink').textContent = data.open_source_url || '-';
        document.getElementById('openSourceLink').href = data.open_source_url || '#';
        document.getElementById('poweredBy').textContent = 'Powered by ' + (data.powered_by || 'Spacebar API');
        var lv = RechNative.getAppVersion() || '0.0.0';
        if (compareVersion(data.app_version, lv) > 0) { document.getElementById('appVersion').textContent = 'v' + lv + ' (新版本 v' + data.app_version + ' 可用)'; }
        var dl = document.getElementById('devList'); dl.innerHTML = '';
        if (data.developers && data.developers.length) {
          data.developers.forEach(function(dev) {
            var c = document.createElement('div'); c.className = 'dev-card';
            c.innerHTML = '<div class="dev-avatar"><img src="' + (dev.avatar||'') + '" onerror="this.style.background=\'linear-gradient(135deg,#6b8cff,#b666ff)\'"></div><div class="dev-info"><div class="dev-name">' + (dev.name||'') + '</div><div class="dev-role">' + (dev.role||'') + '</div>' + (dev.bio?'<div class="dev-bio">'+dev.bio+'</div>':'') + (dev.github?'<div class="dev-github"><a href="'+dev.github+'" onclick="openLink(\''+dev.github+'\');return false;">GitHub</a></div>':'') + '</div>';
            dl.appendChild(c);
          });
        }
      }).catch(function() { document.getElementById('devList').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);">无法加载开发者信息</div>'; });
    });
</script>
</body>
</html>
