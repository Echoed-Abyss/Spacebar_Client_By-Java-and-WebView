<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 关于</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: rgba(255,255,255,0.9);
          min-height: 100vh; min-height: 100dvh;
          padding: 20px;
          -webkit-tap-highlight-color: transparent;
        }
        .header {
          display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
        }
        .back-btn {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.08); border: none;
          color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          font-size: 18px;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .title { font-size: 20px; font-weight: 700; }
        .glass-card {
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 20px;
          padding: 24px; margin-bottom: 16px;
        }
        .app-icon-area {
          display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
        }
        .app-icon {
          width: 64px; height: 64px; border-radius: 16px;
          background: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          display: flex; align-items: center; justify-content: center;
          font-size: 28px; color: white;
        }
        .app-name { font-size: 24px; font-weight: 700; }
        .app-version { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .info-row {
          display: flex; justify-content: space-between;
          padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
          font-size: 14px;
        }
        .info-row .label { color: rgba(255,255,255,0.5); }
        .info-row .value { color: rgba(255,255,255,0.8); }
        .link { color: #6b8cff; text-decoration: none; cursor: pointer; }
        .section-title {
          font-size: 12px; font-weight: 600; text-transform: uppercase;
          color: rgba(255,255,255,0.35); letter-spacing: 1px;
          margin: 20px 0 12px;
        }
        .dev-card {
          display: flex; gap: 14px; align-items: center;
          padding: 16px; margin-bottom: 10px;
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 16px;
        }
        .dev-avatar {
          width: 48px; height: 48px; border-radius: 50%;
          background: rgba(255,255,255,0.2);
          overflow: hidden; flex-shrink: 0;
        }
        .dev-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .dev-info { flex: 1; }
        .dev-name { font-size: 15px; font-weight: 600; }
        .dev-role { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .dev-bio { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
        .dev-github {
          margin-top: 8px; font-size: 12px;
        }
        .dev-github a { color: #6b8cff; text-decoration: none; }
        .powered-by {
          text-align: center; font-size: 12px; color: rgba(255,255,255,0.3);
          margin-top: 24px; padding-bottom: 40px;
        }
        .spinner {
          text-align: center; padding: 40px; color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span class="title">关于 Rech</span>
</div>

<div class="glass-card">
    <div class="app-icon-area">
        <div class="app-icon">R</div>
        <div>
            <div class="app-name">Rech</div>
            <div class="app-version" id="appVersion">加载中...</div>
        </div>
    </div>
    <div class="info-row">
        <span class="label">构建版本</span>
        <span class="value" id="buildNumber">-</span>
    </div>
    <div class="info-row">
        <span class="label">开源地址</span>
        <span class="value"><a class="link" id="openSourceLink" href="#" onclick="openLink(this.href)">-</a></span>
    </div>
</div>

<div class="section-title">开发团队</div>
<div id="devList"><div class="spinner">加载中...</div></div>

<div class="powered-by" id="poweredBy">Powered by Ro_Team</div>

<script>
    // TODO: 替换为你的JSON数据地址
    var DATA_URL = 'http://110.42.50.148:1155/api/image/openown.json';

    window.addEventListener('DOMContentLoaded', function() {
      fetch(DATA_URL)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById('appVersion').textContent = 'v' + data.app_version;
          document.getElementById('buildNumber').textContent = data.build_number;
          document.getElementById('openSourceLink').textContent = data.open_source_url;
          document.getElementById('openSourceLink').href = data.open_source_url;
          document.getElementById('poweredBy').textContent = 'Powered by ' + data.powered_by;

          var devList = document.getElementById('devList');
          devList.innerHTML = '';
          data.developers.forEach(function(dev) {
            var card = document.createElement('div');
            card.className = 'dev-card';
            card.innerHTML =
              '<div class="dev-avatar"><img src="' + dev.avatar + '" onerror="this.style.background=\'linear-gradient(135deg,#6b8cff,#b666ff)\'"></div>' +
              '<div class="dev-info">' +
                '<div class="dev-name">' + dev.name + '</div>' +
                '<div class="dev-role">' + dev.role + '</div>' +
                (dev.bio ? '<div class="dev-bio">' + dev.bio + '</div>' : '') +
                (dev.github ? '<div class="dev-github"><a href="' + dev.github + '" onclick="openLink(\'' + dev.github + '\');return false;">GitHub</a></div>' : '') +
              '</div>';
            devList.appendChild(card);
          });
        })
        .catch(function(e) {
          document.getElementById('devList').innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.4);">无法加载开发者信息</div>';
        });
    });

    function openLink(url) {
      try { RechNative.openUrl(url); } catch(e) { window.open(url, '_blank'); }
    }
</script>
</body>
</html>
