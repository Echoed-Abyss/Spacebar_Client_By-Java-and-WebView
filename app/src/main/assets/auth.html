<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 登录</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: rgba(255,255,255,0.9);
          height: 100vh; height: 100dvh;
          display: flex; align-items: center; justify-content: center;
          -webkit-tap-highlight-color: transparent;
        }
        .container {
          width: 100%; max-width: 400px;
          padding: 24px;
        }
        .logo {
          text-align: center; margin-bottom: 32px;
        }
        .logo-icon {
          width: 80px; height: 80px;
          border-radius: 20px;
          background: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          margin: 0 auto 12px;
          display: flex; align-items: center; justify-content: center;
          font-size: 36px; color: white;
          box-shadow: 0 8px 32px rgba(107,140,255,0.4);
        }
        .logo h1 {
          font-size: 28px;
          background: linear-gradient(135deg, #6b8cff, #b666ff, #ff6b9d);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .glass-card {
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 20px;
          padding: 24px;
          margin-bottom: 16px;
        }
        .official-btn {
          width: 100%;
          padding: 14px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,0.15);
          background: rgba(107,140,255,0.2);
          color: white;
          font-size: 15px;
          cursor: pointer;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          text-align: center;
          margin-bottom: 12px;
        }
        .official-btn:active {
          background: rgba(107,140,255,0.35);
        }
        .official-desc {
          font-size: 12px;
          color: rgba(255,255,255,0.5);
          margin-bottom: 8px;
        }
        .divider {
          text-align: center; color: rgba(255,255,255,0.3);
          margin: 16px 0; font-size: 12px;
        }
        .input-group {
          margin-bottom: 14px;
        }
        .input-group label {
          display: block; font-size: 13px; color: rgba(255,255,255,0.6);
          margin-bottom: 6px;
        }
        .glass-input {
          width: 100%;
          padding: 12px 16px;
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.12);
          background: rgba(255,255,255,0.06);
          color: white;
          font-size: 15px;
          outline: none;
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
        }
        .glass-input:focus {
          border-color: rgba(107,140,255,0.5);
          background: rgba(255,255,255,0.1);
        }
        .glass-input::placeholder {
          color: rgba(255,255,255,0.3);
        }
        .btn-primary {
          width: 100%;
          padding: 14px;
          border-radius: 14px;
          border: none;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          color: white;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          margin-top: 8px;
        }
        .btn-primary:active {
          opacity: 0.8;
        }
        .btn-secondary {
          width: 100%;
          padding: 12px;
          border-radius: 14px;
          border: 1px solid rgba(255,255,255,0.15);
          background: transparent;
          color: rgba(255,255,255,0.7);
          font-size: 14px;
          cursor: pointer;
          margin-top: 8px;
        }
        .checkbox-group {
          display: flex; align-items: center; gap: 8px;
          margin: 12px 0; font-size: 13px; color: rgba(255,255,255,0.6);
        }
        .checkbox-group input {
          accent-color: #6b8cff;
        }
        .agreement {
          font-size: 12px; color: rgba(255,255,255,0.4);
          text-align: center; margin-top: 16px;
        }
        .agreement a {
          color: #6b8cff; text-decoration: none;
        }
        .tab-bar {
          display: flex; gap: 8px; margin-bottom: 20px;
        }
        .tab {
          flex: 1; padding: 10px; text-align: center;
          border-radius: 10px; cursor: pointer;
          border: 1px solid rgba(255,255,255,0.08);
          background: rgba(255,255,255,0.04);
          color: rgba(255,255,255,0.5);
          font-size: 14px;
        }
        .tab.active {
          background: rgba(107,140,255,0.2);
          border-color: rgba(107,140,255,0.4);
          color: white;
        }
        .error-msg {
          color: #ff6b6b; font-size: 13px;
          margin-top: 8px; display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon">R</div>
        <h1>Rech</h1>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('login')">登录</div>
        <div class="tab" onclick="switchTab('register')">注册</div>
    </div>

    <div id="loginForm">
        <div class="glass-card">
            <div class="official-desc">官方服务器</div>
            <button class="official-btn" onclick="setOfficial()">
                https://spacebar.chat/
            </button>
            <div class="divider">— 或输入自托管服务器 —</div>
            <div class="input-group">
                <label>API 地址</label>
                <input class="glass-input" id="apiUrl" type="text" placeholder="http://example.com/api/v9/">
            </div>
        </div>

        <div class="glass-card">
            <div class="input-group">
                <label>邮箱</label>
                <input class="glass-input" id="loginEmail" type="email" placeholder="user@example.com">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input class="glass-input" id="loginPassword" type="password" placeholder="••••••••">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">记住账号和密码</label>
            </div>
            <div class="error-msg" id="loginError"></div>
            <button class="btn-primary" onclick="doLogin()">登录</button>
        </div>
    </div>

    <div id="registerForm" style="display:none;">
        <div class="glass-card">
            <div class="input-group">
                <label>API 地址</label>
                <input class="glass-input" id="regApiUrl" type="text" placeholder="http://example.com/api/v9/">
            </div>
        </div>
        <div class="glass-card">
            <div class="input-group">
                <label>用户名</label>
                <input class="glass-input" id="regUsername" type="text" placeholder="你的用户名">
            </div>
            <div class="input-group">
                <label>邮箱</label>
                <input class="glass-input" id="regEmail" type="email" placeholder="user@example.com">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input class="glass-input" id="regPassword" type="password" placeholder="••••••••">
            </div>
            <div class="error-msg" id="regError"></div>
            <button class="btn-primary" onclick="doRegister()">注册</button>
        </div>
    </div>

    <div class="agreement">
        登录即代表您同意 <a href="#" onclick="openAgreement()">用户协议</a> 和 <a href="#">隐私政策</a>
    </div>
</div>

<script>
    const OFFICIAL_API = 'https://api.rory.server.spacebar.chat/api/v9/';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    function setOfficial() {
      document.getElementById('apiUrl').value = OFFICIAL_API;
      document.getElementById('regApiUrl').value = OFFICIAL_API;
    }

    // 页面加载时尝试自动登录
    window.onload = function() {
      try {
        var creds = JSON.parse(RechNative.getSavedCredentials());
        if (creds.email && creds.password && creds.apiUrl) {
          document.getElementById('apiUrl').value = creds.apiUrl;
          document.getElementById('loginEmail').value = creds.email;
          document.getElementById('loginPassword').value = creds.password;
          document.getElementById('rememberMe').checked = true;
          // 有token直接跳转
          var token = RechNative.getToken();
          if (token) {
            RechNative.navigate('rech_ui.html');
          }
        }
      } catch(e) {}
    };

    function doLogin() {
      var api = document.getElementById('apiUrl').value.trim();
      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value.trim();
      var remember = document.getElementById('rememberMe').checked;

      if (!api) { showError('loginError','请输入API地址'); return; }
      if (!email || !password) { showError('loginError','请输入邮箱和密码'); return; }

      // 确保API地址以/结尾
      if (!api.endsWith('/')) api += '/';

      fetch(api + 'auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: email, password: password })
      })
      .then(r => r.json().then(d => ({ status: r.status, body: d })))
      .then(res => {
        if (res.status === 200 && res.body.token) {
          RechNative.saveToken(res.body.token);
          if (remember) {
            RechNative.saveCredentials(email, password, api);
          }
          RechNative.navigate('rech_ui.html');
        } else {
          showError('loginError', res.body.message || '登录失败');
        }
      })
      .catch(e => showError('loginError', '网络错误: ' + e.message));
    }

    function doRegister() {
      var api = document.getElementById('regApiUrl').value.trim();
      var username = document.getElementById('regUsername').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value.trim();

      if (!api) { showError('regError','请输入API地址'); return; }
      if (!username || !email || !password) { showError('regError','请填写完整信息'); return; }

      if (!api.endsWith('/')) api += '/';

      fetch(api + 'auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, email: email, password: password })
      })
      .then(r => r.json().then(d => ({ status: r.status, body: d })))
      .then(res => {
        if (res.status === 200 || res.status === 201) {
          RechNative.saveToken(res.body.token || '');
          RechNative.saveCredentials(email, password, api);
          alert('注册成功！请登录');
          switchTab('login');
        } else {
          showError('regError', res.body.message || '注册失败');
        }
      })
      .catch(e => showError('regError', '网络错误: ' + e.message));
    }

    function showError(id, msg) {
      var el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(function() { el.style.display = 'none'; }, 3000);
    }

    function openAgreement() {
      alert('用户协议：请合理使用本软件，遵守相关法律法规。');
    }
</script>
</body>
</html>
