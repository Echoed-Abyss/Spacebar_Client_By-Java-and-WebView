<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 设置</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%); color: rgba(255,255,255,0.9); min-height: 100vh; padding: 20px; -webkit-tap-highlight-color: transparent; }
        .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
        .back-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .title { font-size: 20px; font-weight: 700; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
        .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.35); letter-spacing: 1px; margin-bottom: 14px; }
        /* 自定义弹窗 */
.custom-dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.custom-dialog {
  width: 85%; max-width: 320px;
  background: rgba(20,20,40,0.9);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
}
.custom-dialog-title {
  font-size: 18px; font-weight: 700; margin-bottom: 12px;
  background: linear-gradient(135deg, #6b8cff, #b666ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.custom-dialog-message {
  font-size: 14px; color: rgba(255,255,255,0.7);
  margin-bottom: 20px; line-height: 1.6; white-space: pre-line;
}
.custom-dialog-buttons {
  display: flex; gap: 10px;
}
.custom-dialog-btn {
  flex: 1; padding: 12px; border-radius: 12px;
  border: none; font-size: 14px; font-weight: 600; cursor: pointer;
}
.custom-dialog-btn.primary {
  background: linear-gradient(135deg, #6b8cff, #b666ff);
  color: white;
}
.custom-dialog-btn.secondary {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.1);
}
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .setting-label { font-size: 14px; }
        .setting-desc { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
        .toggle { width: 48px; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.15); cursor: pointer; transition: background 0.3s; position: relative; }
        .toggle.on { background: #6b8cff; }
        .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; transition: transform 0.3s; }
        .toggle.on::after { transform: translateX(20px); }
        .btn-primary { width: 100%; padding: 14px; border-radius: 14px; border: none; background: linear-gradient(135deg, #6b8cff, #b666ff); color: white; font-size: 14px; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <span class="title">设置</span>
</div>
<div class="glass-card">
    <div class="section-title">外观</div>
    <div class="setting-row"><div><div class="setting-label">深色主题</div><div class="setting-desc">始终启用深色模式</div></div><div class="toggle on" id="darkToggle" onclick="toggleSwitch(this)"></div></div>
    <div class="setting-row"><div><div class="setting-label">液态玻璃效果</div><div class="setting-desc">启用毛玻璃视觉特效</div></div><div class="toggle on" id="glassToggle" onclick="toggleSwitch(this)"></div></div>
    <div class="setting-row"><div><div class="setting-label">动画效果</div><div class="setting-desc">界面过渡动画</div></div><div class="toggle on" id="animToggle" onclick="toggleSwitch(this)"></div></div>
</div>
<div class="glass-card">
    <div class="section-title">通知</div>
    <div class="setting-row"><div><div class="setting-label">消息通知</div><div class="setting-desc">接收新消息提醒</div></div><div class="toggle on" id="notifToggle" onclick="toggleSwitch(this)"></div></div>
    <div class="setting-row"><div><div class="setting-label">通知声音</div><div class="setting-desc">收到消息时播放声音</div></div><div class="toggle" id="soundToggle" onclick="toggleSwitch(this)"></div></div>
</div>
<div class="glass-card">
    <div class="section-title">缓存</div>
    <div class="setting-row"><div><div class="setting-label">清除缓存</div><div class="setting-desc">清除本地临时数据</div></div><button class="btn-primary" style="width:auto;padding:8px 16px;margin:0;" onclick="clearCache()">清除</button></div>
</div>
<div class="glass-card">
    <div class="section-title">关于</div>
    <div class="setting-row" style="cursor:pointer;" onclick="RechNative.navigate('app_info.html')"><div class="setting-label">关于 Rech</div><span style="color:rgba(255,255,255,0.3);">›</span></div>
    <div class="setting-row" style="cursor:pointer;" onclick="checkUpdate()"><div class="setting-label">检查更新</div><span style="color:rgba(255,255,255,0.5);" id="updateBadge"></span></div>
    <div class="setting-row"><div class="setting-label">当前版本</div><span style="color:rgba(255,255,255,0.5);" id="currentVersion">加载中...</span></div>
</div>
<script>
    function toggleSwitch(el) { el.classList.toggle('on'); var s={}; document.querySelectorAll('.toggle').forEach(function(t){ s[t.id]=t.classList.contains('on'); }); localStorage.setItem('rech_settings', JSON.stringify(s)); }
    function clearCache() { localStorage.clear(); alert('缓存已清除'); }
    function compareVersion(v1, v2) { if(!v1||!v2)return 0; var a1=v1.split('.'),a2=v2.split('.'),l=Math.max(a1.length,a2.length); for(var i=0;i<l;i++){ var n1=parseInt(a1[i]||'0'),n2=parseInt(a2[i]||'0'); if(n1>n2)return 1; if(n1<n2)return -1; } return 0; }

    function checkUpdateSilent() {
      fetch(RechNative.getVersionCheckUrl()).then(function(r){return r.json()}).then(function(d){
        if(compareVersion(d.app_version, RechNative.getAppVersion())>0){ var b=document.getElementById('updateBadge'); if(b){b.textContent='有新版本 v'+d.app_version;b.style.color='#4ade80';} }
      }).catch(function(){});
    }
    // 替换原生alert
window.originalAlert = window.alert;
window.alert = function(msg) {
  showCustomDialog('Rech', msg, [{text:'确定', primary:true, callback:function(){}}]);
};

// 替换原生confirm
window.originalConfirm = window.confirm;
window.confirm = function(msg) {
  return new Promise(function(resolve) {
    showCustomDialog('Rech', msg, [
      {text:'取消', primary:false, callback:function(){ resolve(false); }},
      {text:'确定', primary:true, callback:function(){ resolve(true); }}
    ]);
  });
};

function showCustomDialog(title, message, buttons) {
  var old = document.querySelector('.custom-dialog-overlay');
  if (old) old.remove();

  var overlay = document.createElement('div');
  overlay.className = 'custom-dialog-overlay';

  var btnHtml = '<div class="custom-dialog-buttons">';
  buttons.forEach(function(btn, i) {
    btnHtml += '<button class="custom-dialog-btn ' + (btn.primary ? 'primary' : 'secondary') + '" data-idx="' + i + '">' + btn.text + '</button>';
  });
  btnHtml += '</div>';

  overlay.innerHTML = '<div class="custom-dialog">' +
    '<div class="custom-dialog-title">' + title + '</div>' +
    '<div class="custom-dialog-message">' + message + '</div>' +
    btnHtml +
  '</div>';

  document.body.appendChild(overlay);

  overlay.querySelectorAll('.custom-dialog-btn').forEach(function(el) {
    el.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      overlay.remove();
      if (buttons[idx] && buttons[idx].callback) buttons[idx].callback();
    });
  });
}
    function checkUpdate() {
      var b=document.getElementById('updateBadge'); if(b)b.textContent='检查中...';
      fetch(RechNative.getVersionCheckUrl()).then(function(r){return r.json()}).then(function(d){
        var rv=d.app_version||'', lv=RechNative.getAppVersion()||'0.0.0';
        if(compareVersion(rv,lv)>0){
          var msg='发现新版本 v'+rv+' (Build '+(d.build_number||'')+')'; if(d.update_log)msg+='\n\n更新内容:\n'+d.update_log; msg+='\n\n是否前往下载？';
          if(confirm(msg)) RechNative.openUrl(d.download_url||'https://github.com/TY-China/Spacebar_Client_By-Java-and-WebView/releases/latest');
          if(b){b.textContent='有新版本';b.style.color='#4ade80';}
        } else { alert('已是最新版本 v'+lv); if(b){b.textContent='已是最新';b.style.color='rgba(255,255,255,0.5)';} }
      }).catch(function(){ alert('检查更新失败：网络错误'); if(b){b.textContent='检查失败';b.style.color='#ff6b6b';} });
    }
    window.addEventListener('DOMContentLoaded', function() {
      try { document.getElementById('currentVersion').textContent = 'v' + RechNative.getAppVersion(); } catch(e) {}
      checkUpdateSilent();
      var s=localStorage.getItem('rech_settings'); if(s){ var o=JSON.parse(s); Object.keys(o).forEach(function(k){ var el=document.getElementById(k); if(el){ el.classList.toggle('on', o[k]); } }); }
    });
</script>
</body>
</html>
