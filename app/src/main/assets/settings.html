<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 设置</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: rgba(255,255,255,0.9);
          min-height: 100vh; min-height: 100dvh;
          padding: 20px;
          -webkit-tap-highlight-color: transparent;
        }
        .header {
          display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
        }
        .back-btn {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.08); border: none;
          color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .title { font-size: 20px; font-weight: 700; }
        .glass-card {
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 20px;
          padding: 24px; margin-bottom: 16px;
        }
        .section-title {
          font-size: 12px; font-weight: 600; text-transform: uppercase;
          color: rgba(255,255,255,0.35); letter-spacing: 1px;
          margin-bottom: 14px;
        }
        .setting-row {
          display: flex; justify-content: space-between; align-items: center;
          padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .setting-label { font-size: 14px; }
        .setting-desc { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
        .toggle {
          width: 48px; height: 28px; border-radius: 14px;
          background: rgba(255,255,255,0.15); cursor: pointer;
          transition: background 0.3s; position: relative;
        }
        .toggle.on { background: #6b8cff; }
        .toggle::after {
          content: '';
          position: absolute; top: 3px; left: 3px;
          width: 22px; height: 22px; border-radius: 50%;
          background: white;
          transition: transform 0.3s;
        }
        .toggle.on::after { transform: translateX(20px); }
        .glass-input {
          width: 100%; padding: 12px 16px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.12);
          background: rgba(255,255,255,0.06); color: white;
          font-size: 15px; outline: none; margin-top: 8px;
        }
        .glass-input:focus {
          border-color: rgba(107,140,255,0.5);
          background: rgba(255,255,255,0.1);
        }
        .btn-danger {
          width: 100%; padding: 14px; border-radius: 14px;
          border: 1px solid rgba(255,107,107,0.3);
          background: transparent; color: #ff6b6b;
          font-size: 14px; cursor: pointer; margin-top: 8px;
        }
        .btn-primary {
          width: 100%; padding: 14px; border-radius: 14px;
          border: none;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          color: white; font-size: 14px; cursor: pointer; margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span class="title">设置</span>
</div>

<div class="glass-card">
    <div class="section-title">外观</div>
    <div class="setting-row">
        <div>
            <div class="setting-label">深色主题</div>
            <div class="setting-desc">始终启用深色模式</div>
        </div>
        <div class="toggle on" id="darkToggle" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="setting-row">
        <div>
            <div class="setting-label">液态玻璃效果</div>
            <div class="setting-desc">启用毛玻璃视觉特效</div>
        </div>
        <div class="toggle on" id="glassToggle" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="setting-row">
        <div>
            <div class="setting-label">动画效果</div>
            <div class="setting-desc">界面过渡动画</div>
        </div>
        <div class="toggle on" id="animToggle" onclick="toggleSwitch(this)"></div>
    </div>
</div>

<div class="glass-card">
    <div class="section-title">通知</div>
    <div class="setting-row">
        <div>
            <div class="setting-label">消息通知</div>
            <div class="setting-desc">接收新消息提醒</div>
        </div>
        <div class="toggle on" id="notifToggle" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="setting-row">
        <div>
            <div class="setting-label">通知声音</div>
            <div class="setting-desc">收到消息时播放声音</div>
        </div>
        <div class="toggle" id="soundToggle" onclick="toggleSwitch(this)"></div>
    </div>
</div>

<div class="glass-card">
    <div class="section-title">缓存</div>
    <div class="setting-row">
        <div>
            <div class="setting-label">清除缓存</div>
            <div class="setting-desc">清除本地临时数据</div>
        </div>
        <button class="btn-primary" style="width:auto;padding:8px 16px;margin:0;" onclick="clearCache()">清除</button>
    </div>
</div>

<div class="glass-card">
    <div class="section-title">关于</div>
    <div class="setting-row" style="cursor:pointer;" onclick="RechNative.navigate('app_info.html')">
        <div class="setting-label">关于 Rech</div>
        <span style="color:rgba(255,255,255,0.3);">›</span>
    </div>
</div>

<script>
    function toggleSwitch(el) {
      el.classList.toggle('on');
      var settings = {};
      document.querySelectorAll('.toggle').forEach(function(t) {
        settings[t.id] = t.classList.contains('on');
      });
      localStorage.setItem('rech_settings', JSON.stringify(settings));
    }

    function clearCache() {
      localStorage.clear();
      alert('缓存已清除');
    }

    window.addEventListener('DOMContentLoaded', function() {
      var saved = localStorage.getItem('rech_settings');
      if (saved) {
        var settings = JSON.parse(saved);
        Object.keys(settings).forEach(function(key) {
          var el = document.getElementById(key);
          if (el) {
            if (settings[key]) el.classList.add('on');
            else el.classList.remove('on');
          }
        });
      }
    });
</script>
</body>
</html>
