<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rech · 个人资料</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
          background: radial-gradient(ellipse at 30% 20%, #1a1140 0%, #0a0a18 60%, #050510 100%);
          color: rgba(255,255,255,0.9);
          min-height: 100vh; min-height: 100dvh;
          padding: 20px;
          -webkit-tap-highlight-color: transparent;
        }
        .header {
          display: flex; align-items: center; gap: 14px; margin-bottom: 24px;
        }
        .back-btn {
          width: 36px; height: 36px; border-radius: 50%;
          background: rgba(255,255,255,0.08); border: none;
          color: white; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
        }
        .back-btn:active { background: rgba(255,255,255,0.2); }
        .title { font-size: 20px; font-weight: 700; }
        .glass-card {
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 20px;
          padding: 24px; margin-bottom: 16px;
        }
        .avatar-area {
          display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;
        }
        .avatar-preview {
          width: 80px; height: 80px; border-radius: 50%;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          overflow: hidden; margin-bottom: 12px;
          position: relative;
        }
        .avatar-preview img { width:100%; height:100%; object-fit:cover; }
        .avatar-upload {
          padding: 8px 16px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.2);
          background: rgba(255,255,255,0.08); color: white;
          font-size: 13px; cursor: pointer;
        }
        .avatar-upload input { display: none; }
        .input-group { margin-bottom: 14px; }
        .input-group label {
          display: block; font-size: 13px; color: rgba(255,255,255,0.5);
          margin-bottom: 6px;
        }
        .glass-input {
          width: 100%; padding: 12px 16px; border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.12);
          background: rgba(255,255,255,0.06); color: white;
          font-size: 15px; outline: none;
        }
        .glass-input:focus {
          border-color: rgba(107,140,255,0.5);
          background: rgba(255,255,255,0.1);
        }
        .btn-primary {
          width: 100%; padding: 14px; border-radius: 14px;
          border: none;
          background: linear-gradient(135deg, #6b8cff, #b666ff);
          color: white; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .btn-primary:active { opacity: 0.8; }
        .btn-danger {
          width: 100%; padding: 14px; border-radius: 14px;
          border: 1px solid rgba(255,107,107,0.3);
          background: transparent; color: #ff6b6b;
          font-size: 14px; cursor: pointer; margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="RechNative.navigate('rech_ui.html')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <span class="title">个人资料</span>
</div>

<div class="glass-card">
    <div class="avatar-area">
        <div class="avatar-preview" id="avatarPreview"></div>
        <label class="avatar-upload">
            更换头像
            <input type="file" accept="image/*" onchange="previewAvatar(this)" id="avatarFile">
        </label>
    </div>

    <div class="input-group">
        <label>用户名</label>
        <input class="glass-input" id="editUsername" type="text" placeholder="用户名">
    </div>
    <div class="input-group">
        <label>昵称（全局显示名称）</label>
        <input class="glass-input" id="editGlobalName" type="text" placeholder="你的昵称">
    </div>
    <div class="input-group">
        <label>邮箱</label>
        <input class="glass-input" id="editEmail" type="email" placeholder="user@example.com">
    </div>
    <div class="input-group">
        <label>个人简介</label>
        <input class="glass-input" id="editBio" type="text" placeholder="写一句关于你自己的话...">
    </div>

    <button class="btn-primary" onclick="saveProfile()">保存</button>
    <button class="btn-danger" onclick="logout()">退出登录</button>
</div>

<script>
    var API_BASE = '';
    var AUTH_TOKEN = '';
    var CDN_BASE = 'https://cdn.rory.server.spacebar.chat/';

    function detectCDN(apiUrl) {
      if (apiUrl.indexOf('spacebar.chat') !== -1) {
        return 'https://cdn.rory.server.spacebar.chat/';
      }
      var match = apiUrl.match(/^(.+?)\/api\/v\d+/);
      if (match) return match[1] + '/';
      return apiUrl.replace(/\/api\/v\d+\/?$/, '/');
    }

    function getAvatarUrl(userId, avatarHash) {
      if (!avatarHash) return '';
      var ext = avatarHash.startsWith('a_') ? '.gif' : '.png';
      return CDN_BASE + 'avatars/' + userId + '/' + avatarHash + ext;
    }

    window.addEventListener('DOMContentLoaded', function() {
      AUTH_TOKEN = RechNative.getToken();
      var creds = JSON.parse(RechNative.getSavedCredentials() || '{}');
      API_BASE = creds.apiUrl || '';
      CDN_BASE = detectCDN(API_BASE);
      loadProfile();
    });

    function loadProfile() {
      fetch(API_BASE + 'users/@me', {
        headers: { 'Authorization': AUTH_TOKEN }
      })
      .then(function(r) { return r.json(); })
      .then(function(user) {
        document.getElementById('editUsername').value = user.username || '';
        document.getElementById('editGlobalName').value = user.global_name || '';
        document.getElementById('editEmail').value = user.email || '';
        document.getElementById('editBio').value = user.bio || '';
        if (user.avatar) {
          var url = getAvatarUrl(user.id, user.avatar);
          document.getElementById('avatarPreview').innerHTML = '<img src="' + url + '">';
        }
      });
    }

    function previewAvatar(input) {
      var file = input.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('avatarPreview').innerHTML = '<img src="' + e.target.result + '">';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfile() {
      var data = {
        username: document.getElementById('editUsername').value.trim(),
        global_name: document.getElementById('editGlobalName').value.trim(),
        email: document.getElementById('editEmail').value.trim(),
        bio: document.getElementById('editBio').value.trim()
      };

      fetch(API_BASE + 'users/@me', {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': AUTH_TOKEN
        },
        body: JSON.stringify(data)
      })
      .then(function(r) { return r.json(); })
      .then(function(res) {
        if (res.username) {
          alert('保存成功！');
          RechNative.navigate('rech_ui.html');
        } else {
          alert('保存失败：' + (res.message || '未知错误'));
        }
      });
    }

    function logout() {
      if (confirm('确定退出登录吗？')) {
        RechNative.clearCredentials();
        RechNative.navigate('auth.html');
      }
    }
</script>
</body>
</html>
